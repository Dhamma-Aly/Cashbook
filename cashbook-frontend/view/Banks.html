<!-- view/Banks.html - Mobile-Perfect Banks & Books View (v5.5) -->

<div class="space-y-4 sm:space-y-5">
  
  <!-- Top 4 KPI Cards -->
  <div class="dashboard-kpi-grid grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-emerald-500/10 text-emerald-400 shrink-0"><i class="fa-solid fa-arrow-trend-up text-xl"></i></div>
      <div class="min-w-0 flex-1">
        <p class="text-[10px] uppercase font-bold text-amber-400/80 truncate">စုစုပေါင်းဝင်ငွေ</p>
        <h3 id="kpi-income" class="text-base font-extrabold text-emerald-400 mt-1 truncate font-mono">0 MMK</h3>
      </div>
    </div>
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-rose-500/10 text-rose-400 shrink-0"><i class="fa-solid fa-arrow-trend-down text-xl"></i></div>
      <div class="min-w-0 flex-1">
        <p class="text-[10px] uppercase font-bold text-amber-400/80 truncate">စုစုပေါင်းထွက်ငွေ</p>
        <h3 id="kpi-expense" class="text-base font-extrabold text-rose-400 mt-1 truncate font-mono">0 MMK</h3>
      </div>
    </div>
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-amber-500/10 text-amber-400 shrink-0"><i class="fa-solid fa-scale-balanced text-xl"></i></div>
      <div class="min-w-0 flex-1">
        <p class="text-[10px] uppercase font-bold text-amber-400/80 truncate">လက်ကျန်ငွေ</p>
        <h3 id="kpi-balance" class="text-base font-extrabold text-amber-300 mt-1 truncate font-mono">0 MMK</h3>
      </div>
    </div>
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-sky-500/10 text-sky-400 shrink-0"><i class="fa-solid fa-list-check text-xl"></i></div>
      <div class="min-w-0 flex-1">
        <p class="text-[10px] uppercase font-bold text-amber-400/80 truncate">စာကြောင်းရေ</p>
        <h3 id="kpi-count" class="text-base font-extrabold text-amber-100 mt-1 truncate font-mono">0</h3>
      </div>
    </div>
  </div>

  <!-- Action Bar (Responsive: Mobile Stacked Full-Width, Desktop Single Row) -->
  <div class="flex flex-col md:flex-row justify-between items-center bg-[#0f172a] border border-amber-500/20 p-3 sm:p-4 rounded-xl gap-3 sm:gap-4 shadow-xl">
    
    <!-- Left: Search Box + User 1/2/3 Filter Dropdown -->
    <div class="erp-search-group">
      
      <!-- 🌟 Search Box -->
      <div class="erp-search-box">
        <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #fbbf24; font-size: 13px; pointer-events: none; z-index: 2;"></i>
        <input type="text" id="search-input" oninput="onLedgerSearchInput()" placeholder="စာရင်းများ ရှာဖွေရန်..." style="width: 100%; height: 40px; padding: 0 16px 0 42px; background-color: #050811; border: 1px solid rgba(51, 65, 85, 0.9); border-radius: 12px; color: #f8fafc; font-size: 13px; outline: none; box-sizing: border-box;" class="focus:border-amber-400 focus:ring-1 focus:ring-amber-400/40 transition-all font-medium placeholder:text-slate-500">
      </div>

      <!-- 🌟 User 1 / 2 / 3 Filter Dropdown (Shown on 7 Ledger Books, Hidden on 3 Bank Books) -->
      <div id="user-filter-wrap" class="hidden erp-user-filter flex">
        <i class="fa-solid fa-user-tag" style="position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: #38bdf8; font-size: 12px; pointer-events: none; z-index: 2;"></i>
        <select id="user-filter-select" onchange="onLedgerUserFilterChange(this.value)" style="width: 100%; height: 40px; padding: 0 32px 0 36px; background-color: #050811; border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 12px; color: #f8fafc; font-size: 13px; font-weight: 700; outline: none; appearance: none; -webkit-appearance: none; cursor: pointer; box-sizing: border-box;">
          <option value="ALL">All Users (အားလုံး)</option>
          <option value="User 1">User 1</option>
          <option value="User 2">User 2</option>
          <option value="User 3">User 3</option>
        </select>
        <i class="fa-solid fa-chevron-down" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 10px; pointer-events: none;"></i>
      </div>

    </div>

    <!-- Right Action Buttons (Mobile: Refresh/Export 50-50, Add Entry 100%) -->
    <div class="erp-action-bar-btns">
      <button type="button" onclick="loadSheetView()" class="px-3 py-2 bg-[#1e293b] hover:bg-[#334155] border border-amber-500/30 text-amber-200 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-rotate text-xs"></i> <span>Refresh</span></button>
      <button type="button" onclick="exportCSV()" class="px-3 py-2 bg-[#1e293b] hover:bg-[#334155] border border-amber-500/30 text-amber-200 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-file-export text-xs"></i> <span>Export</span></button>
      <button type="button" id="btn-add-entry" onclick="openAddModal()" class="erp-btn-add px-3.5 py-2 bg-amber-600 hover:bg-amber-500 text-amber-950 rounded-lg text-xs font-black transition-all flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-plus text-xs"></i> <span>စာရင်းအသစ်ထည့်ရန်</span></button>
    </div>
  </div>

  <!-- Table Container -->
  <div class="bg-[#0f172a] border border-amber-500/20 rounded-xl overflow-x-auto shadow-2xl">
    <table class="w-full text-left border-collapse" style="min-width: 1600px !important; width: 100% !important;">
      <thead>
        <tr class="bg-[#080d1a] border-b border-amber-500/30 text-amber-300 text-xs uppercase font-extrabold">
          <th style="width: 50px !important; min-width: 50px !important; text-align: center !important;" class="py-3.5 px-2 font-mono">စဉ်</th>
          <th style="width: 110px !important; min-width: 110px !important; white-space: nowrap !important;" class="py-3.5 px-2">ရက်စွဲ</th>
          <th style="width: 110px !important; min-width: 110px !important; white-space: nowrap !important;" class="py-3.5 px-2">ခေါင်းစဉ်</th>
          <th style="width: 300px !important; min-width: 300px !important; max-width: 420px !important;" class="py-3.5 px-3">အကြောင်းအရာ</th>
          <th style="width: 120px !important; min-width: 120px !important; text-align: right !important; white-space: nowrap !important;" class="py-3.5 px-2 font-mono">ဝင်ငွေ</th>
          <th style="width: 110px !important; min-width: 110px !important; text-align: right !important; white-space: nowrap !important;" class="py-3.5 px-2 font-mono">ထွက်ငွေ</th>
          <th style="width: 130px !important; min-width: 130px !important; text-align: right !important; white-space: nowrap !important;" class="py-3.5 px-2 font-mono">လက်ကျန်</th>
          <th style="width: 150px !important; min-width: 150px !important; white-space: nowrap !important;" class="py-3.5 px-2">ခေါင်းစဉ်ခွဲ</th>
          <th style="width: 95px !important; min-width: 95px !important; white-space: nowrap !important;" class="py-3.5 px-2">ဘောင်ချာ</th>
          <th style="width: 95px !important; min-width: 95px !important; white-space: nowrap !important;" class="py-3.5 px-2">လက်ခံသူ</th>
          <th style="width: 85px !important; min-width: 85px !important; white-space: nowrap !important;" class="py-3.5 px-2 font-mono">လနှစ်</th>
          <th style="width: 150px !important; min-width: 150px !important; white-space: nowrap !important;" class="py-3.5 px-2">စာအုပ်အမည်</th>
          <th style="width: 100px !important; min-width: 100px !important; text-align: center !important;" class="right-0 sticky bg-[#080d1a] py-3.5 px-2 z-10 border-l border-amber-500/30 shadow-[-10px_0_15px_rgba(0,0,0,0.6)]">လုပ်ဆောင်ချက်</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr>
          <td colspan="13" class="text-center py-8 text-amber-400 font-bold">
            <i class="fa-solid fa-spinner fa-spin mr-2"></i> ဒေတာများ ဆွဲယူနေပါသည်...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination Bar -->
  <div id="ledger-pagination-bar" class="flex flex-col sm:flex-row items-center justify-between bg-[#0f172a] border border-amber-500/20 px-4 sm:px-5 py-3 rounded-xl gap-3 sm:gap-4 text-xs">
    <div class="text-amber-200/80 font-medium">
      Showing <span id="page-start" class="font-bold text-amber-400">0</span> to <span id="page-end" class="font-bold text-amber-400">0</span> of <span id="total-entries" class="font-bold text-amber-400">0</span> entries
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-prev-page" onclick="prevPage()" class="px-3.5 py-2 rounded-lg border border-amber-500/30 bg-[#080d1a] hover:bg-[#1e293b] text-amber-200 disabled:opacity-40 font-bold flex items-center gap-2 transition-all cursor-pointer">
        <i class="fa-solid fa-chevron-left text-[10px]"></i> Previous
      </button>

      <button id="btn-next-page" onclick="nextPage()" class="px-3.5 py-2 rounded-lg border border-amber-500/30 bg-[#080d1a] hover:bg-[#1e293b] text-amber-200 disabled:opacity-40 font-bold flex items-center gap-2 transition-all cursor-pointer">
        Next <i class="fa-solid fa-chevron-right text-[10px]"></i>
      </button>
    </div>
  </div>

</div>

<!-- MODAL DIALOG (Mobile 1-Col / Desktop 2-Col + Zero iPhone Auto-Zoom) -->
<div id="entry-modal" class="fixed inset-0 flex items-center justify-center p-3 sm:p-4 hidden" style="background-color: rgba(2, 6, 23, 0.88) !important; z-index: 99999 !important;">
  <div style="width: 100%; max-width: 560px; background-color: #0f172a; border: 1px solid #334155; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); overflow: hidden; display: flex; flex-direction: column; max-height: 90dvh;">
    
    <div style="padding: 14px 18px; background-color: #020617; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
      <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
        <div style="width: 32px; height: 32px; border-radius: 8px; background-color: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); color: #fbbf24; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; flex-shrink: 0;">
          <i class="fa-solid fa-file-circle-plus"></i>
        </div>
        <h3 id="entry-modal-title" style="margin: 0; font-size: 14px; font-weight: 800; color: #fef08a; letter-spacing: 0.3px;">
          စာရင်းအသစ် သွင်းယူ / ပြင်ဆင်ရန်
        </h3>
      </div>
      <button type="button" onclick="closeEntryModal()" style="width: 34px; height: 34px; border-radius: 8px; background-color: #1e293b; color: #94a3b8; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>

    <form id="entry-form" onsubmit="saveEntryForm(event)" style="padding: 18px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; flex: 1;">
      
      <input type="hidden" id="entry-id" value="">

      <div class="erp-modal-grid-2">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 12px; font-weight: 700; color: #f1f5f9; margin: 0; line-height: 1.2;">ရက်စွဲ (Date) <span style="color: #f43f5e;">*</span></label>
          <input type="date" id="entry-date" required style="width: 100%; height: 38px; padding: 0 12px; background-color: #020617; border: 1px solid #334155; border-radius: 10px; color: #f8fafc; font-size: 13px; box-sizing: border-box; outline: none;">
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 12px; font-weight: 700; color: #f1f5f9; margin: 0; line-height: 1.2;">အမျိုးအစား (Type)</label>
          <select id="entry-type" onchange="onEntryTypeChange(this.value)" style="width: 100%; height: 38px; padding: 0 12px; background-color: #020617; border: 1px solid #334155; border-radius: 10px; color: #f8fafc; font-size: 13px; box-sizing: border-box; outline: none;">
            <option value="ဝင်ငွေ">ဝင်ငွေ (Income)</option>
            <option value="ထွက်ငွေ">ထွက်ငွေ (Expense)</option>
            <option value="စာရင်းပြောင်း">စာရင်းပြောင်း (Transfer)</option>
          </select>
        </div>
      </div>

      <div class="erp-modal-grid-2">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 12px; font-weight: 700; color: #f1f5f9; margin: 0; line-height: 1.2;">ခေါင်းစဉ် (Title)</label>
          <select id="entry-category" onchange="onEntryCategoryChange(this.value)" style="width: 100%; height: 38px; padding: 0 12px; background-color: #020617; border: 1px solid #334155; border-radius: 10px; color: #f8fafc; font-size: 13px; box-sizing: border-box; outline: none;">
            <option value="စာရင်းဖွင့်">စာရင်းဖွင့်</option>
            <option value="ဘဏ်အပ်ငွေ">ဘဏ်အပ်ငွေ</option>
            <option value="ဘဏ်ထုတ်ငွေ">ဘဏ်ထုတ်ငွေ</option>
          </select>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label id="label-entry-subcategory" style="font-size: 12px; font-weight: 700; color: #f1f5f9; margin: 0; line-height: 1.2;">ခေါင်းစဉ်ခွဲ (Sub-Title)</label>
          <select id="entry-subcategory" onchange="if(typeof onEntrySubcategoryChange === 'function') onEntrySubcategoryChange(this.value)" style="width: 100%; height: 38px; padding: 0 12px; background-color: #020617; border: 1px solid #334155; border-radius: 10px; color: #f8fafc; font-size: 13px; box-sizing: border-box; outline: none;">
            <option value="စာရင်းဖွင့်လက်ကျန်">စာရင်းဖွင့်လက်ကျန်</option>
          </select>
        </div>
      </div>

      <div class="erp-modal-grid-2">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 12px; font-weight: 700; color: #f1f5f9; margin: 0; line-height: 1.2;">ဘောက်ချာနံပါတ် (Voucher No)</label>
          <input type="text" id="entry-voucher" oninput="if(typeof window.toEnglishDigits === 'function') this.value = window.toEnglishDigits(this.value)" placeholder="ဥပမာ- 6-0001" style="width: 100%; height: 38px; padding: 0 12px; background-color: #020617; border: 1px solid #334155; border-radius: 10px; color: #f8fafc; font-size: 13px; box-sizing: border-box; outline: none; font-family: monospace;">
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 12px; font-weight: 700; color: #f1f5f9; margin: 0; line-height: 1.2;">ငွေပမာဏ (Amount - MMK) <span style="color: #f43f5e;">*</span></label>
          <input type="text" inputmode="decimal" id="entry-amount" required oninput="if(typeof window.toEnglishDigits === 'function') this.value = window.toEnglishDigits(this.value)" placeholder="0.00" style="width: 100%; height: 38px; padding: 0 12px; background-color: #020617; border: 1px solid #334155; border-radius: 10px; color: #f8fafc; font-size: 13px; font-weight: 800; box-sizing: border-box; outline: none; font-family: monospace;">
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px; width: 100%;">
        <label id="label-entry-receiver" style="font-size: 12px; font-weight: 700; color: #f1f5f9; margin: 0; line-height: 1.2;">လက်ခံသူ / တာဝန်ခံ (User/Receiver)</label>
        <select id="entry-receiver" onchange="if(typeof onEntryReceiverChange === 'function') onEntryReceiverChange(this.value)" style="width: 100%; height: 38px; padding: 0 12px; background-color: #020617; border: 1px solid #334155; border-radius: 10px; color: #f8fafc; font-size: 13px; box-sizing: border-box; outline: none;">
          <option value="User 1">User 1</option>
          <option value="User 2">User 2</option>
          <option value="User 3">User 3</option>
        </select>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px; width: 100%;">
        <label style="font-size: 12px; font-weight: 700; color: #f1f5f9; margin: 0; line-height: 1.2;">အကြောင်းအရာ (Description) <span style="color: #f43f5e;">*</span></label>
        <textarea id="entry-description" required rows="2" placeholder="အသေးစိတ် အကြောင်းအရာ ရေးသားပါ..." style="width: 100%; padding: 10px 12px; background-color: #020617; border: 1px solid #334155; border-radius: 10px; color: #f8fafc; font-size: 13px; box-sizing: border-box; outline: none; resize: none;"></textarea>
      </div>

      <div style="padding-top: 12px; border-top: 1px solid #1e293b; display: flex; align-items: center; justify-content: flex-end; gap: 12px;">
        <button type="button" onclick="closeEntryModal()" style="padding: 10px 18px; border-radius: 10px; background-color: #1e293b; color: #cbd5e1; font-size: 13px; font-weight: 700; border: none; cursor: pointer;">Cancel</button>
        <button type="submit" id="btn-entry-save" style="padding: 10px 24px; border-radius: 10px; background: linear-gradient(135deg, #d97706 0%, #b45309 100%); color: #020617; font-size: 13px; font-weight: 900; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3); display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
          <span id="btn-entry-save-text">Save</span>
        </button>
      </div>

    </form>
  </div>
</div>
