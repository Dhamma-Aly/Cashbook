<!-- view/Inventory.html - Inventory View (Ultra-Clean Search Box & 1500px Table) --> 
<div class="space-y-4 sm:space-y-5">
  
  <!-- 🌟 Top 4 KPI Cards (၄ ခု တစ်တန်းတည်း ညီညာစွာ ပေါ်စေသည်) -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
    <!-- မီးဖိုဆောင် -->
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-amber-500/10 text-amber-400 shrink-0">
        <i class="fa-solid fa-kitchen-set text-xl"></i>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-[10px] uppercase font-bold text-amber-400/80 truncate">မီးဖိုဆောင်</p>
        <h3 id="kpi-inv-kitchen" class="text-base font-extrabold text-amber-300 mt-1 truncate font-mono">0</h3>
      </div>
    </div>

    <!-- ဓမ္မာရုံ -->
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-sky-500/10 text-sky-400 shrink-0">
        <i class="fa-solid fa-om text-xl"></i>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-[10px] uppercase font-bold text-sky-400/80 truncate">ဓမ္မာရုံ</p>
        <h3 id="kpi-inv-dhammahall" class="text-base font-extrabold text-sky-400 mt-1 truncate font-mono">0</h3>
      </div>
    </div>

    <!-- သိမ် -->
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-emerald-500/10 text-emerald-400 shrink-0">
        <i class="fa-solid fa-gopuram text-xl"></i>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-[10px] uppercase font-bold text-amber-400/80 truncate">သိမ်</p>
        <h3 id="kpi-inv-sim" class="text-base font-extrabold text-emerald-400 mt-1 truncate font-mono">0</h3>
      </div>
    </div>

    <!-- စတို -->
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-rose-500/10 text-rose-400 shrink-0">
        <i class="fa-solid fa-warehouse text-xl"></i>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-[10px] uppercase font-bold text-rose-400/80 truncate">စတို</p>
        <h3 id="kpi-inv-store" class="text-base font-extrabold text-amber-100 mt-1 truncate font-mono">0</h3>
      </div>
    </div>
  </div>

  <!-- Action Bar -->
  <div class="flex flex-col md:flex-row justify-between items-center bg-[#0f172a] border border-amber-500/20 p-3 sm:p-4 rounded-xl gap-3 sm:gap-4 shadow-xl">
    
    <!-- 🌟 သပ်ရပ် လှပသော Ultra-Clean Search Box (Icon အလယ်တည့်တည့်ကျပြီး စာသားမထပ်စေပါ) -->
    <div style="position: relative !important; width: 100% !important; max-width: 380px !important; display: flex !important; align-items: center !important;">
      <i class="fa-solid fa-magnifying-glass" style="position: absolute !important; left: 15px !important; top: 50% !important; transform: translateY(-50%) !important; color: #fbbf24 !important; font-size: 13px !important; pointer-events: none !important; z-index: 2 !important;"></i>
      <input type="text" id="inv-search-input" oninput="onInvSearchInput()" placeholder="ပစ္စည်းစာရင်း ရှာဖွေရန်..." style="width: 100% !important; height: 40px !important; padding: 0 16px 0 42px !important; background-color: #050811 !important; border: 1px solid rgba(51, 65, 85, 0.9) !important; border-radius: 12px !important; color: #f8fafc !important; font-size: 13px !important; outline: none !important; box-sizing: border-box !important;" class="focus:border-amber-400 focus:ring-1 focus:ring-amber-400/40 transition-all font-medium placeholder:text-slate-500">
    </div>

    <!-- Right Action Buttons -->
    <div class="flex items-center gap-2 sm:gap-2.5 justify-end w-full md:w-auto shrink-0 whitespace-nowrap">
      <button onclick="renderInventoryView()" class="p-2 sm:px-3 sm:py-2 bg-[#1e293b] hover:bg-[#334155] border border-amber-500/30 text-amber-200 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-rotate text-xs"></i> Refresh</button>
      <button onclick="exportInventoryCSV()" class="p-2 sm:px-3 sm:py-2 bg-[#1e293b] hover:bg-[#334155] border border-amber-500/30 text-amber-200 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-file-export text-xs"></i> Export</button>
      <button id="btn-add-inv" onclick="openAddInvModal()" class="p-2 sm:px-3.5 sm:py-2 bg-amber-600 hover:bg-amber-500 text-amber-950 rounded-lg text-xs font-black transition-all flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-plus text-xs"></i> + ပစ္စည်းအသစ်ထည့်ရန်</button>
    </div>
  </div>

  <!-- Table Container (🌟 1500px ဖြင့် သပ်ရပ်စွာ နေရာချထားသည်) -->
  <div class="bg-[#0f172a] border border-amber-500/20 rounded-xl overflow-x-auto shadow-2xl" style="-webkit-overflow-scrolling: touch;">
    <table class="w-full text-left border-collapse" style="min-width: 1500px !important; width: 100% !important;">
      <thead>
        <tr class="bg-[#080d1a] border-b border-amber-500/30 text-amber-300 text-xs uppercase font-extrabold">
          <th style="width: 50px !important; min-width: 50px !important; text-align: center !important;" class="py-3.5 px-2 font-mono">စဉ်</th>
          <th style="width: 110px !important; min-width: 110px !important; white-space: nowrap !important;" class="py-3.5 px-2">ရက်စွဲ</th>
          <th style="width: 130px !important; min-width: 130px !important; white-space: nowrap !important;" class="py-3.5 px-2">တည်နေရာ</th>
          <th style="width: 140px !important; min-width: 140px !important; white-space: nowrap !important;" class="py-3.5 px-2">အမျိုးအစား</th>
          <!-- 🌟 အကြောင်းအရာ/ပစ္စည်းအမည် ကော်လံအား 300px ပုံသေ အကျယ်ချဲ့ထားသည် -->
          <th style="width: 300px !important; min-width: 300px !important; max-width: 450px !important;" class="py-3.5 px-3">အကြောင်းအရာ / ပစ္စည်းအမည်</th>
          <th style="width: 100px !important; min-width: 100px !important; white-space: nowrap !important;" class="py-3.5 px-2">ရေတွက်ပုံ</th>
          <th style="width: 110px !important; min-width: 110px !important; text-align: right !important; white-space: nowrap !important;" class="py-3.5 px-2 font-mono">အရေအတွက်</th>
          <th style="width: 200px !important; min-width: 200px !important; max-width: 320px !important;" class="py-3.5 px-2">မှတ်ချက်</th>
          <th style="width: 90px !important; min-width: 90px !important; white-space: nowrap !important;" class="py-3.5 px-2 font-mono">လနှစ်</th>
          <th style="width: 150px !important; min-width: 150px !important; white-space: nowrap !important;" class="py-3.5 px-2">စာအုပ်အမည်</th>
          <!-- 🌟 လုပ်ဆောင်ချက် အောက်သို့ စာလုံးမထပ်စေရန် Shadow & Border ခံထားသည် -->
          <th style="width: 100px !important; min-width: 100px !important; text-align: center !important;" class="right-0 sticky bg-[#080d1a] py-3.5 px-2 z-10 border-l border-amber-500/30 shadow-[-10px_0_15px_rgba(0,0,0,0.6)]">လုပ်ဆောင်ချက်</th>
        </tr>
      </thead>
      <tbody id="inv-table-body">
        <tr>
          <td colspan="11" class="text-center py-8 text-amber-400 font-bold">
            <i class="fa-solid fa-spinner fa-spin mr-2"></i> ဒေတာများ ဆွဲယူနေပါသည်...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination Bar -->
  <div id="inv-pagination-bar" class="flex flex-col sm:flex-row items-center justify-between bg-[#0f172a] border border-amber-500/20 px-4 sm:px-5 py-3 rounded-xl gap-3 sm:gap-4 text-xs">
    <div class="text-amber-200/80 font-medium">
      Showing <span id="inv-page-start" class="font-bold text-amber-400">0</span> to <span id="inv-page-end" class="font-bold text-amber-400">0</span> of <span id="inv-total-entries" class="font-bold text-amber-400">0</span> entries
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-inv-prev-page" onclick="prevInvPage()" class="px-3.5 py-2 rounded-lg border border-amber-500/30 bg-[#080d1a] hover:bg-[#1e293b] text-amber-200 disabled:opacity-40 font-bold flex items-center gap-2 transition-all cursor-pointer">
        <i class="fa-solid fa-chevron-left text-[10px]"></i> Previous
      </button>

      <button id="btn-inv-next-page" onclick="nextInvPage()" class="px-3.5 py-2 rounded-lg border border-amber-500/30 bg-[#080d1a] hover:bg-[#1e293b] text-amber-200 disabled:opacity-40 font-bold flex items-center gap-2 transition-all cursor-pointer">
        Next <i class="fa-solid fa-chevron-right text-[10px]"></i>
      </button>
    </div>
  </div>

</div>

<!-- 💡 MODAL DIALOG -->
<div id="inv-entry-modal" class="fixed inset-0 flex items-center justify-center p-4 hidden" style="background-color: rgba(2, 6, 23, 0.88) !important; z-index: 99999 !important;">
  <div style="width: 100% !important; max-width: 560px !important; background-color: #0f172a !important; border: 1px solid #334155 !important; border-radius: 16px !important; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8) !important; overflow: hidden !important; display: flex !important; flex-direction: column !important; max-height: 90vh !important;">
    
    <div style="padding: 14px 20px !important; background-color: #020617 !important; border-bottom: 1px solid #1e293b !important; display: flex !important; align-items: center !important; justify-content: space-between !important; shrink: 0;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 32px; height: 32px; border-radius: 8px; background-color: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); color: #fbbf24; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold;">
          <i class="fa-solid fa-boxes-packing"></i>
        </div>
        <h3 id="inv-modal-title" style="margin: 0; font-size: 14px; font-weight: 800; color: #fef08a; letter-spacing: 0.5px;">
          ပစ္စည်းအသစ် သွင်းယူ / ပြင်ဆင်ရန်
        </h3>
      </div>
      <button type="button" onclick="closeInvModal()" style="width: 32px; height: 32px; border-radius: 8px; background-color: #1e293b; color: #94a3b8; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>

    <form id="inv-entry-form" onsubmit="saveInventoryForm(event)" style="padding: 20px !important; display: flex !important; flex-direction: column !important; gap: 16px !important; overflow-y: auto !important; flex: 1 !important;">
      <input type="hidden" id="inv-id" value="">

      <!-- Row 1: Date & Location -->
      <div style="display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 14px !important; width: 100% !important;">
        <div style="display: flex !important; flex-direction: column !important; gap: 6px !important;">
          <label style="font-size: 12px !important; font-weight: 700 !important; color: #f1f5f9 !important; margin: 0 !important; line-height: 1.2 !important;">ရက်စွဲ (Date) <span style="color: #f43f5e;">*</span></label>
          <input type="date" id="inv-date" required style="width: 100% !important; height: 38px !important; padding: 0 12px !important; background-color: #020617 !important; border: 1px solid #334155 !important; border-radius: 10px !important; color: #f8fafc !important; font-size: 12px !important; box-sizing: border-box !important; outline: none !important;">
        </div>

        <div style="display: flex !important; flex-direction: column !important; gap: 6px !important;">
          <label style="font-size: 12px !important; font-weight: 700 !important; color: #f1f5f9 !important; margin: 0 !important; line-height: 1.2 !important;">တည်နေရာ (Location)</label>
          <select id="inv-location" style="width: 100% !important; height: 38px !important; padding: 0 12px !important; background-color: #020617 !important; border: 1px solid #334155 !important; border-radius: 10px !important; color: #f8fafc !important; font-size: 12px !important; box-sizing: border-box !important; outline: none !important;">
            <option value="မီးဖိုဆောင်">မီးဖိုဆောင်</option>
            <option value="ဓမ္မာရုံ">ဓမ္မာရုံ</option>
            <option value="သိမ်">သိမ်</option>
            <option value="စတို">စတို</option>
            <option value="အခြား">အခြား</option>
          </select>
        </div>
      </div>

      <!-- Row 2: Category & Description -->
      <div style="display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 14px !important; width: 100% !important;">
        <div style="display: flex !important; flex-direction: column !important; gap: 6px !important;">
          <label style="font-size: 12px !important; font-weight: 700 !important; color: #f1f5f9 !important; margin: 0 !important; line-height: 1.2 !important;">အမျိုးအစား (Category)</label>
          <select id="inv-category" style="width: 100% !important; height: 38px !important; padding: 0 12px !important; background-color: #020617 !important; border: 1px solid #334155 !important; border-radius: 10px !important; color: #f8fafc !important; font-size: 12px !important; box-sizing: border-box !important; outline: none !important;">
            <option value="ပရိဘောဂ">ပရိဘောဂ</option>
            <option value="လျှပ်စစ်">လျှပ်စစ်ပစ္စည်း</option>
            <option value="မီးဖိုချောင်သုံး">မီးဖိုချောင်သုံး</option>
            <option value="ဆေးဝါး/ကျန်းမာရေး">ဆေးဝါး/ကျန်းမာရေး</option>
            <option value="အဝတ်အထည်">အဝတ်အထည် / အခင်း</option>
            <option value="အထွေထွေ">အထွေထွေ</option>
          </select>
        </div>

        <div style="display: flex !important; flex-direction: column !important; gap: 6px !important;">
          <label style="font-size: 12px !important; font-weight: 700 !important; color: #f1f5f9 !important; margin: 0 !important; line-height: 1.2 !important;">အကြောင်းအရာ / ပစ္စည်းအမည် <span style="color: #f43f5e;">*</span></label>
          <input type="text" id="inv-item-name" required placeholder="ဥပမာ- ပလတ်စတစ်ကုလားထိုင်" style="width: 100% !important; height: 38px !important; padding: 0 12px !important; background-color: #020617 !important; border: 1px solid #334155 !important; border-radius: 10px !important; color: #f8fafc !important; font-size: 12px !important; box-sizing: border-box !important; outline: none !important;">
        </div>
      </div>

      <!-- Row 3: Unit & Quantity (🌟 ဗမာဂဏန်းရော Eng ပါ ရိုက်ခွင့်ပြုသည်) -->
      <div style="display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 14px !important; width: 100% !important;">
        <div style="display: flex !important; flex-direction: column !important; gap: 6px !important;">
          <label style="font-size: 12px !important; font-weight: 700 !important; color: #f1f5f9 !important; margin: 0 !important; line-height: 1.2 !important;">ရေတွက်ပုံ (Unit)</label>
          <select id="inv-unit" style="width: 100% !important; height: 38px !important; padding: 0 12px !important; background-color: #020617 !important; border: 1px solid #334155 !important; border-radius: 10px !important; color: #f8fafc !important; font-size: 12px !important; box-sizing: border-box !important; outline: none !important;">
            <option value="ခု">ခု</option>
            <option value="စုံ">စုံ</option>
            <option value="လုံး">လုံး</option>
            <option value="ထုပ်">ထုပ်</option>
            <option value="ဖာ">ဖာ</option>
            <option value="ကတ်">ကတ်</option>
            <option value="စီး">စီး</option>
            <option value="အခြား">အခြား</option>
          </select>
        </div>

        <div style="display: flex !important; flex-direction: column !important; gap: 6px !important;">
          <label style="font-size: 12px !important; font-weight: 700 !important; color: #f1f5f9 !important; margin: 0 !important; line-height: 1.2 !important;">အရေအတွက် (Quantity) <span style="color: #f43f5e;">*</span></label>
          <input type="text" inputmode="numeric" id="inv-qty" required oninput="if(typeof window.toEnglishDigits === 'function') this.value = window.toEnglishDigits(this.value)" placeholder="1" style="width: 100% !important; height: 38px !important; padding: 0 12px !important; background-color: #020617 !important; border: 1px solid #334155 !important; border-radius: 10px !important; color: #f8fafc !important; font-size: 12px !important; font-weight: 800 !important; box-sizing: border-box !important; outline: none !important; font-family: monospace;">
        </div>
      </div>

      <!-- Row 4: Remark -->
      <div style="display: flex !important; flex-direction: column !important; gap: 6px !important; width: 100% !important;">
        <label style="font-size: 12px !important; font-weight: 700 !important; color: #f1f5f9 !important; margin: 0 !important; line-height: 1.2 !important;">မှတ်ချက် (Remark)</label>
        <textarea id="inv-remark" rows="2" placeholder="ဖြည့်စွက် အချက်အလက်များ (ဥပမာ- အသစ်/ဟောင်း)..." style="width: 100% !important; padding: 10px 12px !important; background-color: #020617 !important; border: 1px solid #334155 !important; border-radius: 10px !important; color: #f8fafc !important; font-size: 12px !important; box-sizing: border-box !important; outline: none !important; resize: none !important;"></textarea>
      </div>

      <!-- Footer Buttons -->
      <div style="padding-top: 12px !important; border-top: 1px solid #1e293b !important; display: flex !important; align-items: center !important; justify-content: flex-end !important; gap: 12px !important;">
        <button type="button" onclick="closeInvModal()" style="padding: 8px 18px !important; border-radius: 10px !important; background-color: #1e293b !important; color: #cbd5e1 !important; font-size: 12px !important; font-weight: 700 !important; border: none !important; cursor: pointer !important;">Cancel</button>
        <button type="submit" style="padding: 8px 22px !important; border-radius: 10px !important; background: linear-gradient(135deg, #d97706 0%, #b45309 100%) !important; color: #020617 !important; font-size: 12px !important; font-weight: 900 !important; border: none !important; cursor: pointer !important; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3) !important;">Save</button>
      </div>
    </form>
  </div>
</div>
