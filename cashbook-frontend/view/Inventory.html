<!-- view/Inventory.html - Mobile-Perfect Inventory View (v5.5) --> 
<div class="space-y-4 sm:space-y-5">
  
  <!-- 🌟 Top 4 KPI Cards -->
  <div class="dashboard-kpi-grid grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
    <!-- မီးဖိုဆောင် -->
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-amber-500/10 text-amber-400 shrink-0">
        <i class="fa-solid fa-kitchen-set text-xl"></i>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-[10px] uppercase font-bold text-amber-400/80 truncate">မီးဖိုဆောင်</p>
        <h3 id="kpi-inv-kitchen" class="text-base font-extrabold text-amber-300 mt-1 truncate font-mono">0</h3>
      </div>
    </div>

    <!-- ဓမ္မာရုံ -->
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-sky-500/10 text-sky-400 shrink-0">
        <i class="fa-solid fa-om text-xl"></i>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-[10px] uppercase font-bold text-sky-400/80 truncate">ဓမ္မာရုံ</p>
        <h3 id="kpi-inv-dhammahall" class="text-base font-extrabold text-sky-400 mt-1 truncate font-mono">0</h3>
      </div>
    </div>

    <!-- သိမ် -->
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-emerald-500/10 text-emerald-400 shrink-0">
        <i class="fa-solid fa-gopuram text-xl"></i>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-[10px] uppercase font-bold text-amber-400/80 truncate">သိမ်</p>
        <h3 id="kpi-inv-sim" class="text-base font-extrabold text-emerald-400 mt-1 truncate font-mono">0</h3>
      </div>
    </div>

    <!-- စတို -->
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-rose-500/10 text-rose-400 shrink-0">
        <i class="fa-solid fa-warehouse text-xl"></i>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-[10px] uppercase font-bold text-rose-400/80 truncate">စတို</p>
        <h3 id="kpi-inv-store" class="text-base font-extrabold text-amber-100 mt-1 truncate font-mono">0</h3>
      </div>
    </div>
  </div>

  <!-- Action Bar -->
  <div class="flex flex-col md:flex-row justify-between items-center bg-[#0f172a] border border-amber-500/20 p-3 sm:p-4 rounded-xl gap-3 sm:gap-4 shadow-xl">
    
    <!-- 🌟 Search Box -->
    <div class="erp-search-group">
      <div class="erp-search-box">
        <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #fbbf24; font-size: 13px; pointer-events: none; z-index: 2;"></i>
        <input type="text" id="inv-search-input" oninput="onInvSearchInput()" placeholder="ပစ္စည်းစာရင်း ရှာဖွေရန်..." style="width: 100%; height: 40px; padding: 0 16px 0 42px; background-color: #050811; border: 1px solid rgba(51, 65, 85, 0.9); border-radius: 12px; color: #f8fafc; font-size: 13px; outline: none; box-sizing: border-box;" class="focus:border-amber-400 focus:ring-1 focus:ring-amber-400/40 transition-all font-medium placeholder:text-slate-500">
      </div>
    </div>

    <!-- Right Action Buttons -->
    <div class="erp-action-bar-btns">
      <button type="button" onclick="renderInventoryView()" class="px-3 py-2 bg-[#1e293b] hover:bg-[#334155] border border-amber-500/30 text-amber-200 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-rotate text-xs"></i> <span>Refresh</span></button>
      <button type="button" onclick="exportInventoryCSV()" class="px-3 py-2 bg-[#1e293b] hover:bg-[#334155] border border-amber-500/30 text-amber-200 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-file-export text-xs"></i> <span>Export</span></button>
      <button type="button" id="btn-add-inv" onclick="openAddInvModal()" class="erp-btn-add px-3.5 py-2 bg-amber-600 hover:bg-amber-500 text-amber-950 rounded-lg text-xs font-black transition-all flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-plus text-xs"></i> <span>ပစ္စည်းအသစ်ထည့်ရန်</span></button>
    </div>
  </div>

  <!-- Table Container -->
  <div class="bg-[#0f172a] border border-amber-500/20 rounded-xl overflow-x-auto shadow-2xl">
    <table class="w-full text-left border-collapse" style="min-width: 1500px !important; width: 100% !important;">
      <thead>
        <tr class="bg-[#080d1a] border-b border-amber-500/30 text-amber-300 text-xs uppercase font-extrabold">
          <th style="width: 50px !important; min-width: 50px !important; text-align: center !important;" class="py-3.5 px-2 font-mono">စဉ်</th>
          <th style="width: 110px !important; min-width: 110px !important; white-space: nowrap !important;" class="py-3.5 px-2">ရက်စွဲ</th>
          <th style="width: 130px !important; min-width: 130px !important; white-space: nowrap !important;" class="py-3.5 px-2">တည်နေရာ</th>
          <th style="width: 140px !important; min-width: 140px !important; white-space: nowrap !important;" class="py-3.5 px-2">အမျိုးအစား</th>
          <th style="width: 300px !important; min-width: 300px !important; max-width: 450px !important;" class="py-3.5 px-3">အကြောင်းအရာ / ပစ္စည်းအမည်</th>
          <th style="width: 100px !important; min-width: 100px !important; white-space: nowrap !important;" class="py-3.5 px-2">ရေတွက်ပုံ</th>
          <th style="width: 110px !important; min-width: 110px !important; text-align: right !important; white-space: nowrap !important;" class="py-3.5 px-2 font-mono">အရေအတွက်</th>
          <th style="width: 200px !important; min-width: 200px !important; max-width: 320px !important;" class="py-3.5 px-2">မှတ်ချက်</th>
          <th style="width: 90px !important; min-width: 90px !important; white-space: nowrap !important;" class="py-3.5 px-2 font-mono">လနှစ်</th>
          <th style="width: 150px !important; min-width: 150px !important; white-space: nowrap !important;" class="py-3.5 px-2">စာအုပ်အမည်</th>
          <th style="width: 100px !important; min-width: 100px !important; text-align: center !important;" class="right-0 sticky bg-[#080d1a] py-3.5 px-2 z-10 border-l border-amber-500/30 shadow-[-10px_0_15px_rgba(0,0,0,0.6)]">လုပ်ဆောင်ချက်</th>
        </tr>
      </thead>
      <tbody id="inv-table-body">
        <tr>
          <td colspan="11" class="text-center py-8 text-amber-400 font-bold">
            <i class="fa-solid fa-spinner fa-spin mr-2"></i> ဒေတာများ ဆွဲယူနေပါသည်...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination Bar -->
  <div id="inv-pagination-bar" class="flex flex-col sm:flex-row items-center justify-between bg-[#0f172a] border border-amber-500/20 px-4 sm:px-5 py-3 rounded-xl gap-3 sm:gap-4 text-xs">
    <div class="text-amber-200/80 font-medium">
      Showing <span id="inv-page-start" class="font-bold text-amber-400">0</span> to <span id="inv-page-end" class="font-bold text-amber-400">0</span> of <span id="inv-total-entries" class="font-bold text-amber-400">0</span> entries
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-inv-prev-page" onclick="prevInvPage()" class="px-3.5 py-2 rounded-lg border border-amber-500/30 bg-[#080d1a] hover:bg-[#1e293b] text-amber-200 disabled:opacity-40 font-bold flex items-center gap-2 transition-all cursor-pointer">
        <i class="fa-solid fa-chevron-left text-[10px]"></i> Previous
      </button>

      <button id="btn-inv-next-page" onclick="nextInvPage()" class="px-3.5 py-2 rounded-lg border border-amber-500/30 bg-[#080d1a] hover:bg-[#1e293b] text-amber-200 disabled:opacity-40 font-bold flex items-center gap-2 transition-all cursor-pointer">
        Next <i class="fa-solid fa-chevron-right text-[10px]"></i>
      </button>
    </div>
  </div>

</div>

<!-- 💡 MODAL DIALOG (Mobile 1-Col / Desktop 2-Col + Zero iPhone Auto-Zoom) -->
<div id="inv-entry-modal" class="fixed inset-0 flex items-center justify-center p-3 sm:p-4 hidden" style="background-color: rgba(2, 6, 23, 0.88) !important; z-index: 99999 !important;">
  <div style="width: 100%; max-width: 560px; background-color: #0f172a; border: 1px solid #334155; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); overflow: hidden; display: flex; flex-direction: column; max-height: 90dvh;">
    
    <div style="padding: 14px 18px; background-color: #020617; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
      <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
        <div style="width: 32px; height: 32px; border-radius: 8px; background-color: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); color: #fbbf24; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; flex-shrink: 0;">
          <i class="fa-solid fa-boxes-packing"></i>
        </div>
        <h3 id="inv-modal-title" style="margin: 0; font-size: 14px; font-weight: 800; color: #fef08a; letter-spacing: 0.3px;">
          ပစ္စည်းအသစ် သွင်းယူ / ပြင်ဆင်ရန်
        </h3>
      </div>
      <button type="button" onclick="closeInvModal()" style="width: 34px; height: 34px; border-radius: 8px; background-color: #1e293b; color: #94a3b8; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>

    <form id="inv-entry-form" onsubmit="saveInventoryForm(event)" style="padding: 18px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; flex: 1;">
      <input type="hidden" id="inv-id" value="">

      <!-- Row 1: Date & Location -->
      <div class="erp-modal-grid-2">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 12px; font-weight: 700; color: #f1f5f9; margin: 0; line-height: 1.2;">ရက်စွဲ (Date) <span style="color: #f43f5e;">*</span></label>
          <input type="date" id="inv-date" required style="width: 100%; height: 38px; padding: 0 12px; background-color: #020617; border: 1px solid #334155; border-radius: 10px; color: #f8fafc; font-size: 13px; box-sizing: border-box; outline: none;">
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 12px; font-weight: 700; color: #f1f5f9; margin: 0; line-height: 1.2;">တည်နေရာ (Location)</label>
          <select id="inv-location" style="width: 100%; height: 38px; padding: 0 12px; background-color: #020617; border: 1px solid #334155; border-radius: 10px; color: #f8fafc; font-size: 13px; box-sizing: border-box; outline: none;">
            <option value="မီးဖိုဆောင်">မီးဖိုဆောင်</option>
            <option value="ဓမ္မာရုံ">ဓမ္မာရုံ</option>
            <option value="သိမ်">သိမ်</option>
            <option value="စတို">စတို</option>
            <option value="အခြား">အခြား</option>
          </select>
        </div>
      </div>

      <!-- Row 2: Category & Description -->
      <div class="erp-modal-grid-2">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 12px; font-weight: 700; color: #f1f5f9; margin: 0; line-height: 1.2;">အမျိုးအစား (Category)</label>
          <select id="inv-category" style="width: 100%; height: 38px; padding: 0 12px; background-color: #020617; border: 1px solid #334155; border-radius: 10px; color: #f8fafc; font-size: 13px; box-sizing: border-box; outline: none;">
            <option value="ပရိဘောဂ">ပရိဘောဂ</option>
            <option value="လျှပ်စစ်">လျှပ်စစ်ပစ္စည်း</option>
            <option value="မီးဖိုချောင်သုံး">မီးဖိုချောင်သုံး</option>
            <option value="ဆေးဝါး/ကျန်းမာရေး">ဆေးဝါး/ကျန်းမာရေး</option>
            <option value="အဝတ်အထည်">အဝတ်အထည် / အခင်း</option>
            <option value="အထွေထွေ">အထွေထွေ</option>
          </select>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 12px; font-weight: 700; color: #f1f5f9; margin: 0; line-height: 1.2;">အကြောင်းအရာ / ပစ္စည်းအမည် <span style="color: #f43f5e;">*</span></label>
          <input type="text" id="inv-item-name" required placeholder="ဥပမာ- ပလတ်စတစ်ကုလားထိုင်" style="width: 100%; height: 38px; padding: 0 12px; background-color: #020617; border: 1px solid #334155; border-radius: 10px; color: #f8fafc; font-size: 13px; box-sizing: border-box; outline: none;">
        </div>
      </div>

      <!-- Row 3: Unit & Quantity -->
      <div class="erp-modal-grid-2">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 12px; font-weight: 700; color: #f1f5f9; margin: 0; line-height: 1.2;">ရေတွက်ပုံ (Unit)</label>
          <select id="inv-unit" style="width: 100%; height: 38px; padding: 0 12px; background-color: #020617; border: 1px solid #334155; border-radius: 10px; color: #f8fafc; font-size: 13px; box-sizing: border-box; outline: none;">
            <option value="ခု">ခု</option>
            <option value="စုံ">စုံ</option>
            <option value="လုံး">လုံး</option>
            <option value="ထုပ်">ထုပ်</option>
            <option value="ဖာ">ဖာ</option>
            <option value="ကတ်">ကတ်</option>
            <option value="စီး">စီး</option>
            <option value="အခြား">အခြား</option>
          </select>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 12px; font-weight: 700; color: #f1f5f9; margin: 0; line-height: 1.2;">အရေအတွက် (Quantity) <span style="color: #f43f5e;">*</span></label>
          <input type="text" inputmode="numeric" id="inv-qty" required oninput="if(typeof window.toEnglishDigits === 'function') this.value = window.toEnglishDigits(this.value)" placeholder="1" style="width: 100%; height: 38px; padding: 0 12px; background-color: #020617; border: 1px solid #334155; border-radius: 10px; color: #f8fafc; font-size: 13px; font-weight: 800; box-sizing: border-box; outline: none; font-family: monospace;">
        </div>
      </div>

      <!-- Row 4: Remark -->
      <div style="display: flex; flex-direction: column; gap: 6px; width: 100%;">
        <label style="font-size: 12px; font-weight: 700; color: #f1f5f9; margin: 0; line-height: 1.2;">မှတ်ချက် (Remark)</label>
        <textarea id="inv-remark" rows="2" placeholder="ဖြည့်စွက် အချက်အလက်များ (ဥပမာ- အသစ်/ဟောင်း)..." style="width: 100%; padding: 10px 12px; background-color: #020617; border: 1px solid #334155; border-radius: 10px; color: #f8fafc; font-size: 13px; box-sizing: border-box; outline: none; resize: none;"></textarea>
      </div>

      <!-- Footer Buttons -->
      <div style="padding-top: 12px; border-top: 1px solid #1e293b; display: flex; align-items: center; justify-content: flex-end; gap: 12px;">
        <button type="button" onclick="closeInvModal()" style="padding: 10px 18px; border-radius: 10px; background-color: #1e293b; color: #cbd5e1; font-size: 13px; font-weight: 700; border: none; cursor: pointer;">Cancel</button>
        <button type="submit" style="padding: 10px 24px; border-radius: 10px; background: linear-gradient(135deg, #d97706 0%, #b45309 100%); color: #020617; font-size: 13px; font-weight: 900; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);">Save</button>
      </div>
    </form>
  </div>
</div>
