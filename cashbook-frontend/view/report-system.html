<!-- view/report-system.html - Mobile-Perfect Annual & Summary Expense Matrix Report (v5.5) -->

<div id="report-section" class="space-y-4">
  
  <!-- 🌟 RESPONSIVE ACTION BAR (Mobile: Clean 2-Row Wrap | Desktop: Single Row) -->
  <div class="bg-[#0f172a] border border-amber-500/25 p-3 rounded-xl shadow-xl">
    <div class="erp-report-toolbar">
      
      <!-- 🌟 Search Box (Full-Width on Mobile, Zero iPhone Auto-Zoom) -->
      <div class="erp-search-box">
        <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #fbbf24; font-size: 13px; pointer-events: none; z-index: 2;"></i>
        <input type="text" id="report-search-input" oninput="onReportSearchInput()" placeholder="အစီရင်ခံစာ ရှာဖွေရန်..." style="width: 100%; height: 40px; padding: 0 16px 0 42px; background-color: #020617; border: 1px solid rgba(245, 158, 11, 0.45); border-radius: 10px; color: #f8fafc; font-size: 13px; outline: none; box-sizing: border-box; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);" class="focus:border-amber-400 focus:ring-1 focus:ring-amber-400/50 transition-all font-medium placeholder:text-slate-400">
      </div>

      <!-- Right Controls: Mode Toggle, Year Select, Refresh & Export -->
      <div class="erp-report-controls">
        
        <!-- Annual vs Summary Mode Toggle -->
        <div class="flex items-center gap-1 bg-[#080d1a] border border-amber-500/25 p-1 rounded-xl text-xs shrink-0">
          <button type="button" id="btn-report-annual" onclick="switchReportMode('Annual')" class="px-3 py-1.5 rounded-lg font-extrabold text-amber-300 bg-[#1e293b] border border-amber-500/30 transition-all flex items-center gap-1.5 cursor-pointer shadow-sm">
            <i class="fa-solid fa-calendar-days text-amber-400 text-xs"></i>
            <span>Annual</span>
          </button>

          <button type="button" id="btn-report-summary" onclick="switchReportMode('Summary')" class="px-3 py-1.5 rounded-lg font-bold text-amber-400/60 hover:text-amber-200 transition-all flex items-center gap-1.5 cursor-pointer">
            <i class="fa-solid fa-chart-column text-amber-400/70 text-xs"></i>
            <span>Summary</span>
          </button>
        </div>

        <!-- Year Selector Dropdown -->
        <div class="flex items-center gap-2 bg-[#080d1a] border border-amber-500/30 px-3 py-1.5 rounded-xl text-xs font-bold text-amber-200 shrink-0">
          <i class="fa-solid fa-calendar text-amber-400 text-xs"></i>
          <label for="report-year-select" class="text-amber-300/80 font-bold">ခုနှစ်:</label>
          <select id="report-year-select" onchange="onReportYearChange(this.value)" class="bg-transparent text-amber-300 font-extrabold outline-none cursor-pointer">
            <option value="2026" selected>2026</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
          </select>
        </div>

        <!-- Refresh & Export Action Buttons -->
        <div class="flex items-center gap-2 shrink-0">
          <button type="button" onclick="renderReportView()" class="px-3 py-2 bg-[#1e293b] hover:bg-[#334155] border border-amber-500/30 text-amber-200 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer" title="Refresh">
            <i class="fa-solid fa-rotate text-xs"></i>
            <span>Refresh</span>
          </button>
          
          <button type="button" onclick="exportReportCSV()" class="px-3.5 py-2 bg-amber-600 hover:bg-amber-500 text-amber-950 rounded-lg text-xs font-black transition-all flex items-center gap-1.5 cursor-pointer" title="Export CSV">
            <i class="fa-solid fa-file-export text-xs"></i>
            <span>Export</span>
          </button>
        </div>

      </div>

    </div>
  </div>

  <!-- 📊 16-Column Matrix Table Container -->
  <div class="bg-[#0f172a] border border-amber-500/20 rounded-xl sm:rounded-2xl overflow-x-auto shadow-2xl relative">
    <table id="report-matrix-table" class="w-full text-left border-collapse text-xs" style="min-width: 1650px !important; width: 100% !important;">
      <thead id="report-table-header">
        <tr class="bg-[#080d1a] border-b border-amber-500/30 text-amber-300 uppercase font-extrabold">
          <th style="width: 80px !important; min-width: 80px !important;" class="py-3.5 px-3">အမျိုးအစား</th>
          <th style="width: 180px !important; min-width: 180px !important;" class="py-3.5 px-3">ခေါင်းစဉ်</th>
          <th style="width: 200px !important; min-width: 200px !important;" class="py-3.5 px-3">ခေါင်းစဉ်ခွဲ</th>
          <th class="text-right w-24 py-3.5 px-2">Jan-26</th>
          <th class="text-right w-24 py-3.5 px-2">Feb-26</th>
          <th class="text-right w-24 py-3.5 px-2">Mar-26</th>
          <th class="text-right w-24 py-3.5 px-2">Apr-26</th>
          <th class="text-right w-24 py-3.5 px-2">May-26</th>
          <th class="text-right w-24 py-3.5 px-2">Jun-26</th>
          <th class="text-right w-24 py-3.5 px-2">Jul-26</th>
          <th class="text-right w-24 py-3.5 px-2">Aug-26</th>
          <th class="text-right w-24 py-3.5 px-2">Sep-26</th>
          <th class="text-right w-24 py-3.5 px-2">Oct-26</th>
          <th class="text-right w-24 py-3.5 px-2">Nov-26</th>
          <th class="text-right w-24 py-3.5 px-2">Dec-26</th>
          <th style="width: 120px !important; min-width: 120px !important;" class="text-right py-3.5 px-3 bg-amber-500/10 text-amber-300 font-black">စုစုပေါင်း</th>
        </tr>
      </thead>
      <tbody id="report-table-body" class="divide-y divide-amber-500/10">
        <tr>
          <td colspan="16" class="text-center py-16 text-amber-400 font-bold">
            <i class="fa-solid fa-dharmachakra fa-spin text-xl mr-3 text-amber-400/60"></i>
            အစီရင်ခံစာ ဒေတာများ ဆွဲယူနေပါသည်...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
