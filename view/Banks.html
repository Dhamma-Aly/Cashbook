<!-- view/Banks.html (or view/Books.html) - World-Class Standard 2-Column Modal --> 

<div class="space-y-5">
  
  <!-- Top 4 KPI Cards -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-emerald-500/10 text-emerald-400"><i class="fa-solid fa-arrow-trend-up text-xl"></i></div>
      <div>
        <p class="text-[10px] uppercase font-bold text-amber-500/70">စုစုပေါင်းဝင်ငွေ</p>
        <h3 id="kpi-income" class="text-base font-extrabold text-emerald-400 mt-1">0 MMK</h3>
      </div>
    </div>
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-rose-500/10 text-rose-400"><i class="fa-solid fa-arrow-trend-down text-xl"></i></div>
      <div>
        <p class="text-[10px] uppercase font-bold text-amber-500/70">စုစုပေါင်းထွက်ငွေ</p>
        <h3 id="kpi-expense" class="text-base font-extrabold text-rose-400 mt-1">0 MMK</h3>
      </div>
    </div>
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-amber-500/10 text-amber-400"><i class="fa-solid fa-scale-balanced text-xl"></i></div>
      <div>
        <p class="text-[10px] uppercase font-bold text-amber-500/70">လက်ကျန်ငွေ</p>
        <h3 id="kpi-balance" class="text-base font-extrabold text-amber-300 mt-1">0 MMK</h3>
      </div>
    </div>
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-sky-500/10 text-sky-400"><i class="fa-solid fa-list-check text-xl"></i></div>
      <div>
        <p class="text-[10px] uppercase font-bold text-amber-500/70">စာကြောင်းရေ</p>
        <h3 id="kpi-count" class="text-base font-extrabold text-amber-100 mt-1">0</h3>
      </div>
    </div>
  </div>

  <!-- Action Bar -->
  <div class="flex flex-col md:flex-row justify-between items-center bg-[#14110d] border border-amber-900/30 p-4 rounded-xl gap-4">
    <div class="w-full md:w-1/2 relative">
      <input type="text" id="search-input" oninput="onLedgerSearchInput()" placeholder="ရှာဖွေရန်..." class="w-full pl-3 pr-4 py-2 text-xs rounded-lg bg-[#0a0806] border border-amber-900/40 text-amber-100 outline-none focus:border-amber-400">
    </div>
    <div class="flex items-center gap-2.5 justify-end w-full md:w-auto shrink-0 whitespace-nowrap">
      <button onclick="loadSheetView()" class="p-2.5 bg-[#1f1913] hover:bg-[#2a2118] border border-amber-900/30 text-amber-200 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-rotate text-xs"></i> Refresh</button>
      <button onclick="exportCSV()" class="p-2.5 bg-[#1f1913] hover:bg-[#2a2118] border border-amber-900/30 text-amber-200 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-file-export text-xs"></i> Export</button>
      <button id="btn-add-entry" onclick="openAddModal()" class="p-2.5 bg-amber-600 hover:bg-amber-500 text-amber-950 rounded-lg text-xs font-black transition-all flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-plus text-xs"></i> + စာရင်းအသစ်ထည့်ရန်</button>
    </div>
  </div>

  <!-- Table Container -->
  <div class="bg-[#14110d] border border-amber-900/30 rounded-xl overflow-x-auto shadow-2xl">
    <table class="w-full text-left border-collapse min-w-[1480px]">
      <thead>
        <tr class="bg-[#0a0806] border-b border-amber-900/40 text-amber-400 text-xs">
          <th class="w-12 text-center py-3 px-2">စဉ်</th>
          <th class="w-28 py-3 px-2">ရက်စွဲ</th>
          <th class="w-24 py-3 px-2">ခေါင်းစဉ်</th>
          <th class="w-36 py-3 px-2">ခေါင်းစဉ်ခွဲ</th>
          <th class="w-28 py-3 px-2">ဘောင်ချာ</th>
          <th class="min-w-[280px] py-3 px-2">အကြောင်းအရာ</th>
          <th class="w-28 py-3 px-2">လက်ခံသူ</th>
          <th class="w-32 text-right py-3 px-2">ဝင်ငွေ</th>
          <th class="w-32 text-right py-3 px-2">ထွက်ငွေ</th>
          <th class="w-32 text-right py-3 px-2">လက်ကျန်</th>
          <th class="w-24 py-3 px-2">လနှစ်</th>
          <th class="w-36 py-3 px-2">စာအုပ်အမည်</th>
          <th class="w-24 text-center right-0 sticky bg-[#0a0806] py-3 px-2">လုပ်ဆောင်ချက်</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr>
          <td colspan="13" class="text-center py-8 text-amber-400 font-bold">
            <i class="fa-solid fa-spinner fa-spin mr-2"></i> ဒေတာများ ဆွဲယူနေပါသည်...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination Bar -->
  <div id="ledger-pagination-bar" class="flex flex-col sm:flex-row items-center justify-between bg-[#14110d] border border-amber-900/30 px-5 py-3 rounded-xl gap-4 text-xs">
    <div class="text-amber-200/80 font-medium">
      Showing <span id="page-start" class="font-bold text-amber-400">0</span> to <span id="page-end" class="font-bold text-amber-400">0</span> of <span id="total-entries" class="font-bold text-amber-400">0</span> entries
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-prev-page" onclick="prevPage()" class="px-3.5 py-2 rounded-lg border border-amber-900/40 bg-[#0a0806] hover:bg-[#1f1913] text-amber-200 disabled:opacity-40 font-bold flex items-center gap-2 transition-all cursor-pointer">
        <i class="fa-solid fa-chevron-left text-[10px]"></i> Previous
      </button>

      <button id="btn-next-page" onclick="nextPage()" class="px-3.5 py-2 rounded-lg border border-amber-900/40 bg-[#0a0806] hover:bg-[#1f1913] text-amber-200 disabled:opacity-40 font-bold flex items-center gap-2 transition-all cursor-pointer">
        Next <i class="fa-solid fa-chevron-right text-[10px]"></i>
      </button>
    </div>
  </div>

</div>

<!-- 💡 International Standard Compact Centered 2-Column Modal -->
<div id="entry-modal" class="fixed inset-0 flex items-center justify-center p-4 hidden" style="background-color: rgba(3, 7, 18, 0.92) !important; z-index: 99999 !important;">
  <div class="rounded-2xl border border-amber-500/35 shadow-2xl overflow-hidden flex flex-col" style="width: 100% !important; max-width: 600px !important; background-color: #0e172a !important; color: #f8fafc !important; max-height: 90vh !important;">
    
    <!-- Modal Header -->
    <div class="px-6 py-4 border-b border-amber-500/25 flex items-center justify-between shrink-0" style="background-color: #080d1a !important;">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-amber-500/15 border border-amber-500/30 text-amber-400 flex items-center justify-center text-sm font-bold">
          <i class="fa-solid fa-file-circle-plus"></i>
        </div>
        <h3 id="entry-modal-title" class="text-sm sm:text-base font-black text-amber-300 tracking-wide">
          စာရင်းအသစ် သွင်းယူ / ပြင်ဆင်ရန်
        </h3>
      </div>
      <button type="button" onclick="closeEntryModal()" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-rose-400 transition flex items-center justify-center cursor-pointer">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>

    <!-- Modal Form Body (Strict CSS Grid - Zero Overlapping) -->
    <form id="entry-form" onsubmit="saveEntryForm(event)" class="flex-1 overflow-y-auto p-6 text-xs" style="display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 14px 16px !important;">
      
      <!-- Hidden Inputs -->
      <input type="hidden" id="entry-id" value="">

      <!-- Row 1 Col 1: ရက်စွဲ -->
      <div style="display: flex; flex-direction: column; width: 100%;">
        <label class="font-extrabold text-amber-200/90 mb-1.5" style="display: block;">ရက်စွဲ (Date) <span class="text-rose-400">*</span></label>
        <input type="date" id="entry-date" required class="w-full h-10 px-3 border border-amber-500/30 rounded-xl text-slate-200 outline-none focus:border-amber-400 font-bold" style="background-color: #080d1a !important; color: #f8fafc !important; width: 100% !important; box-sizing: border-box !important;">
      </div>

      <!-- Row 1 Col 2: အမျိုးအစား -->
      <div style="display: flex; flex-direction: column; width: 100%;">
        <label class="font-extrabold text-amber-200/90 mb-1.5" style="display: block;">အမျိုးအစား (Type)</label>
        <select id="entry-type" class="w-full h-10 px-3 border border-amber-500/30 rounded-xl text-slate-200 outline-none focus:border-amber-400 font-bold" style="background-color: #080d1a !important; color: #f8fafc !important; width: 100% !important; box-sizing: border-box !important;">
          <option value="ဝင်ငွေ">ဝင်ငွေ (Income)</option>
          <option value="ထွက်ငွေ">ထွက်ငွေ (Expense)</option>
        </select>
      </div>

      <!-- Row 2 Col 1: ခေါင်းစဉ် -->
      <div style="display: flex; flex-direction: column; width: 100%;">
        <label class="font-extrabold text-amber-200/90 mb-1.5" style="display: block;">ခေါင်းစဉ် (Category)</label>
        <select id="entry-category" class="w-full h-10 px-3 border border-amber-500/30 rounded-xl text-slate-200 outline-none focus:border-amber-400 font-bold" style="background-color: #080d1a !important; color: #f8fafc !important; width: 100% !important; box-sizing: border-box !important;">
          <option value="အထွေထွေ">အထွေထွေ</option>
          <option value="လှူဒါန်းငွေ">လှူဒါန်းငွေ</option>
          <option value="ဆွမ်းပဒေသာပင်">ဆွမ်းပဒေသာပင်</option>
          <option value="ကျောင်းရန်ပုံငွေ">ကျောင်းရန်ပုံငွေ</option>
        </select>
      </div>

      <!-- Row 2 Col 2: ခေါင်းစဉ်ခွဲ -->
      <div style="display: flex; flex-direction: column; width: 100%;">
        <label class="font-extrabold text-amber-200/90 mb-1.5" style="display: block;">ခေါင်းစဉ်ခွဲ (Sub-Category)</label>
        <input type="text" id="entry-subcategory" placeholder="ပုံမှန်" class="w-full h-10 px-3 border border-amber-500/30 rounded-xl text-slate-200 outline-none focus:border-amber-400" style="background-color: #080d1a !important; color: #f8fafc !important; width: 100% !important; box-sizing: border-box !important;">
      </div>

      <!-- Row 3 Col 1: ဘောက်ချာနံပါတ် -->
      <div style="display: flex; flex-direction: column; width: 100%;">
        <label class="font-extrabold text-amber-200/90 mb-1.5" style="display: block;">ဘောက်ချာနံပါတ် (Voucher No)</label>
        <input type="text" id="entry-voucher" placeholder="ဥပမာ- ၆၅၀-၁၂" class="w-full h-10 px-3 border border-amber-500/30 rounded-xl text-slate-200 placeholder:text-slate-500 outline-none focus:border-amber-400 font-mono" style="background-color: #080d1a !important; color: #f8fafc !important; width: 100% !important; box-sizing: border-box !important;">
      </div>

      <!-- Row 3 Col 2: ငွေပမာဏ -->
      <div style="display: flex; flex-direction: column; width: 100%;">
        <label class="font-extrabold text-amber-200/90 mb-1.5" style="display: block;">ငွေပမာဏ (Amount - MMK) <span class="text-rose-400">*</span></label>
        <input type="number" id="entry-amount" required placeholder="0.00" class="w-full h-10 px-3 border border-amber-500/30 rounded-xl text-slate-200 placeholder:text-slate-500 outline-none focus:border-amber-400 font-mono font-black text-sm" style="background-color: #080d1a !important; color: #f8fafc !important; width: 100% !important; box-sizing: border-box !important;">
      </div>

      <!-- Row 4 Span 2: လက်ခံသူ / တာဝန်ခံ (Dropdown List: User 1, User 2, User 3) -->
      <div style="grid-column: span 2 !important; display: flex; flex-direction: column; width: 100%;">
        <label class="font-extrabold text-amber-200/90 mb-1.5" style="display: block;">လက်ခံသူ / တာဝန်ခံ (User/Receiver)</label>
        <select id="entry-receiver" class="w-full h-10 px-3 border border-amber-500/30 rounded-xl text-slate-200 outline-none focus:border-amber-400 font-bold" style="background-color: #080d1a !important; color: #f8fafc !important; width: 100% !important; box-sizing: border-box !important;">
          <option value="">-- တာဝန်ခံ ရွေးချယ်ပါ --</option>
          <option value="User 1">User 1</option>
          <option value="User 2">User 2</option>
          <option value="User 3">User 3</option>
        </select>
      </div>

      <!-- Row 5 Span 2: အကြောင်းအရာ -->
      <div style="grid-column: span 2 !important; display: flex; flex-direction: column; width: 100%;">
        <label class="font-extrabold text-amber-200/90 mb-1.5" style="display: block;">အကြောင်းအရာ (Description)</label>
        <textarea id="entry-description" rows="2" placeholder="အသေးစိတ် အကြောင်းအရာ ရေးသားပါ..." class="w-full p-3 border border-amber-500/30 rounded-xl text-slate-200 placeholder:text-slate-500 outline-none focus:border-amber-400 resize-none" style="background-color: #080d1a !important; color: #f8fafc !important; width: 100% !important; box-sizing: border-box !important;"></textarea>
      </div>

      <!-- Modal Footer Action Buttons -->
      <div style="grid-column: span 2 !important; pt-4 border-t border-slate-800 flex items-center justify-end gap-3 shrink-0;">
        <button type="button" onclick="closeEntryModal()" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-extrabold text-xs transition cursor-pointer">
          မသိမ်းတော့ပါ (Cancel)
        </button>

        <button type="submit" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 via-amber-600 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-black text-xs transition shadow-lg shadow-amber-500/20 flex items-center gap-2 cursor-pointer">
          <i class="fa-solid fa-floppy-disk"></i>
          <span>သိမ်းဆည်းမည် (Save)</span>
        </button>
      </div>

    </form>
  </div>
</div>
