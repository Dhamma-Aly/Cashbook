<!-- view/Banks.html (and view/Books.html) - Standard Clean Non-Overlapping Modal -->

<div class="space-y-5">
  
  <!-- Top 4 KPI Cards -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-emerald-500/10 text-emerald-400"><i class="fa-solid fa-arrow-trend-up text-xl"></i></div>
      <div>
        <p class="text-[10px] uppercase font-bold text-amber-500/70">စုစုပေါင်းဝင်ငွေ</p>
        <h3 id="kpi-income" class="text-base font-extrabold text-emerald-400 mt-1">0 MMK</h3>
      </div>
    </div>
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-rose-500/10 text-rose-400"><i class="fa-solid fa-arrow-trend-down text-xl"></i></div>
      <div>
        <p class="text-[10px] uppercase font-bold text-amber-500/70">စုစုပေါင်းထွက်ငွေ</p>
        <h3 id="kpi-expense" class="text-base font-extrabold text-rose-400 mt-1">0 MMK</h3>
      </div>
    </div>
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-amber-500/10 text-amber-400"><i class="fa-solid fa-scale-balanced text-xl"></i></div>
      <div>
        <p class="text-[10px] uppercase font-bold text-amber-500/70">လက်ကျန်ငွေ</p>
        <h3 id="kpi-balance" class="text-base font-extrabold text-amber-300 mt-1">0 MMK</h3>
      </div>
    </div>
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-sky-500/10 text-sky-400"><i class="fa-solid fa-list-check text-xl"></i></div>
      <div>
        <p class="text-[10px] uppercase font-bold text-amber-500/70">စာကြောင်းရေ</p>
        <h3 id="kpi-count" class="text-base font-extrabold text-amber-100 mt-1">0</h3>
      </div>
    </div>
  </div>

  <!-- Action Bar -->
  <div class="flex flex-col md:flex-row justify-between items-center bg-[#14110d] border border-amber-900/30 p-4 rounded-xl gap-4">
    <div class="w-full md:w-1/2 relative">
      <input type="text" id="search-input" oninput="onLedgerSearchInput()" placeholder="ရှာဖွေရန်..." class="w-full pl-3 pr-4 py-2 text-xs rounded-lg bg-[#0a0806] border border-amber-900/40 text-amber-100 outline-none focus:border-amber-400">
    </div>
    <div class="flex items-center gap-2.5 justify-end w-full md:w-auto shrink-0 whitespace-nowrap">
      <button onclick="loadSheetView()" class="p-2.5 bg-[#1f1913] hover:bg-[#2a2118] border border-amber-900/30 text-amber-200 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-rotate text-xs"></i> Refresh</button>
      <button onclick="exportCSV()" class="p-2.5 bg-[#1f1913] hover:bg-[#2a2118] border border-amber-900/30 text-amber-200 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-file-export text-xs"></i> Export</button>
      <button id="btn-add-entry" onclick="openAddModal()" class="p-2.5 bg-amber-600 hover:bg-amber-500 text-amber-950 rounded-lg text-xs font-black transition-all flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-plus text-xs"></i> + စာရင်းအသစ်ထည့်ရန်</button>
    </div>
  </div>

  <!-- Table Container -->
  <div class="bg-[#14110d] border border-amber-900/30 rounded-xl overflow-x-auto shadow-2xl">
    <table class="w-full text-left border-collapse min-w-[1480px]">
      <thead>
        <tr class="bg-[#0a0806] border-b border-amber-900/40 text-amber-400 text-xs">
          <th class="w-12 text-center py-3 px-2">စဉ်</th>
          <th class="w-28 py-3 px-2">ရက်စွဲ</th>
          <th class="w-24 py-3 px-2">ခေါင်းစဉ်</th>
          <th class="w-36 py-3 px-2">ခေါင်းစဉ်ခွဲ</th>
          <th class="w-28 py-3 px-2">ဘောင်ချာ</th>
          <th class="min-w-[280px] py-3 px-2">အကြောင်းအရာ</th>
          <th class="w-28 py-3 px-2">လက်ခံသူ</th>
          <th class="w-32 text-right py-3 px-2">ဝင်ငွေ</th>
          <th class="w-32 text-right py-3 px-2">ထွက်ငွေ</th>
          <th class="w-32 text-right py-3 px-2">လက်ကျန်</th>
          <th class="w-24 py-3 px-2">လနှစ်</th>
          <th class="w-36 py-3 px-2">စာအုပ်အမည်</th>
          <th class="w-24 text-center right-0 sticky bg-[#0a0806] py-3 px-2">လုပ်ဆောင်ချက်</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr>
          <td colspan="13" class="text-center py-8 text-amber-400 font-bold">
            <i class="fa-solid fa-spinner fa-spin mr-2"></i> ဒေတာများ ဆွဲယူနေပါသည်...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination Bar -->
  <div id="ledger-pagination-bar" class="flex flex-col sm:flex-row items-center justify-between bg-[#14110d] border border-amber-900/30 px-5 py-3 rounded-xl gap-4 text-xs">
    <div class="text-amber-200/80 font-medium">
      Showing <span id="page-start" class="font-bold text-amber-400">0</span> to <span id="page-end" class="font-bold text-amber-400">0</span> of <span id="total-entries" class="font-bold text-amber-400">0</span> entries
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-prev-page" onclick="prevPage()" class="px-3.5 py-2 rounded-lg border border-amber-900/40 bg-[#0a0806] hover:bg-[#1f1913] text-amber-200 disabled:opacity-40 font-bold flex items-center gap-2 transition-all cursor-pointer">
        <i class="fa-solid fa-chevron-left text-[10px]"></i> Previous
      </button>

      <button id="btn-next-page" onclick="nextPage()" class="px-3.5 py-2 rounded-lg border border-amber-900/40 bg-[#0a0806] hover:bg-[#1f1913] text-amber-200 disabled:opacity-40 font-bold flex items-center gap-2 transition-all cursor-pointer">
        Next <i class="fa-solid fa-chevron-right text-[10px]"></i>
      </button>
    </div>
  </div>

</div>

<!-- 💡 STANDARD COMPACT MODAL (Zero Overlapping Guarantee) -->
<div id="entry-modal" class="fixed inset-0 flex items-center justify-center p-4 hidden" style="background-color: rgba(2, 6, 23, 0.88) !important; z-index: 99999 !important;">
  <div style="width: 100% !important; max-width: 560px !important; background-color: #0f172a !important; border: 1px solid #334155 !important; border-radius: 16px !important; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8) !important; overflow: hidden !important; display: flex !important; flex-direction: column !important; max-height: 90vh !important;">
    
    <!-- Modal Header -->
    <div style="padding: 14px 20px !important; background-color: #020617 !important; border-bottom: 1px solid #1e293b !important; display: flex !important; align-items: center !important; justify-content: space-between !important; shrink: 0;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 32px; height: 32px; border-radius: 8px; background-color: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); color: #fbbf24; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold;">
          <i class="fa-solid fa-file-circle-plus"></i>
        </div>
        <h3 id="entry-modal-title" style="margin: 0; font-size: 14px; font-weight: 800; color: #fef08a; letter-spacing: 0.5px;">
          စာရင်းအသစ် သွင်းယူ / ပြင်ဆင်ရန်
        </h3>
      </div>
      <button type="button" onclick="closeEntryModal()" style="width: 32px; height: 32px; border-radius: 8px; background-color: #1e293b; color: #94a3b8; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>

    <!-- Modal Form Body -->
    <form id="entry-form" onsubmit="saveEntryForm(event)" style="padding: 20px !important; display: flex !important; flex-direction: column !important; gap: 14px !important; overflow-y: auto !important; flex: 1 !important;">
      
      <input type="hidden" id="entry-id" value="">

      <!-- Row 1: Date & Type -->
      <div style="display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 14px !important; width: 100% !important;">
        <div style="display: flex !important; flex-direction: column !important; gap: 6px !important;">
          <label style="font-size: 12px !important; font-weight: 700 !important; color: #f1f5f9 !important; margin: 0 !important; line-height: 1.2 !important;">ရက်စွဲ (Date) <span style="color: #f43f5e;">*</span></label>
          <input type="date" id="entry-date" required style="width: 100% !important; height: 38px !important; padding: 0 12px !important; background-color: #020617 !important; border: 1px solid #334155 !important; border-radius: 10px !important; color: #f8fafc !important; font-size: 12px !important; box-sizing: border-box !important; outline: none !important;">
        </div>

        <div style="display: flex !important; flex-direction: column !important; gap: 6px !important;">
          <label style="font-size: 12px !important; font-weight: 700 !important; color: #f1f5f9 !important; margin: 0 !important; line-height: 1.2 !important;">အမျိုးအစား (Type)</label>
          <select id="entry-type" style="width: 100% !important; height: 38px !important; padding: 0 12px !important; background-color: #020617 !important; border: 1px solid #334155 !important; border-radius: 10px !important; color: #f8fafc !important; font-size: 12px !important; box-sizing: border-box !important; outline: none !important;">
            <option value="ဝင်ငွေ">ဝင်ငွေ (Income)</option>
            <option value="ထွက်ငွေ">ထွက်ငွေ (Expense)</option>
          </select>
        </div>
      </div>

      <!-- Row 2: Category & Subcategory -->
      <div style="display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 14px !important; width: 100% !important;">
        <div style="display: flex !important; flex-direction: column !important; gap: 6px !important;">
          <label style="font-size: 12px !important; font-weight: 700 !important; color: #f1f5f9 !important; margin: 0 !important; line-height: 1.2 !important;">ခေါင်းစဉ် (Category)</label>
          <select id="entry-category" style="width: 100% !important; height: 38px !important; padding: 0 12px !important; background-color: #020617 !important; border: 1px solid #334155 !important; border-radius: 10px !important; color: #f8fafc !important; font-size: 12px !important; box-sizing: border-box !important; outline: none !important;">
            <option value="အထွေထွေ">အထွေထွေ</option>
            <option value="လှူဒါန်းငွေ">လှူဒါန်းငွေ</option>
            <option value="ဆွမ်းပဒေသာပင်">ဆွမ်းပဒေသာပင်</option>
            <option value="ကျောင်းရန်ပုံငွေ">ကျောင်းရန်ပုံငွေ</option>
          </select>
        </div>

        <div style="display: flex !important; flex-direction: column !important; gap: 6px !important;">
          <label style="font-size: 12px !important; font-weight: 700 !important; color: #f1f5f9 !important; margin: 0 !important; line-height: 1.2 !important;">ခေါင်းစဉ်ခွဲ (Sub-Category)</label>
          <input type="text" id="entry-subcategory" placeholder="ပုံမှန်" style="width: 100% !important; height: 38px !important; padding: 0 12px !important; background-color: #020617 !important; border: 1px solid #334155 !important; border-radius: 10px !important; color: #f8fafc !important; font-size: 12px !important; box-sizing: border-box !important; outline: none !important;">
        </div>
      </div>

      <!-- Row 3: Voucher & Amount -->
      <div style="display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 14px !important; width: 100% !important;">
        <div style="display: flex !important; flex-direction: column !important; gap: 6px !important;">
          <label style="font-size: 12px !important; font-weight: 700 !important; color: #f1f5f9 !important; margin: 0 !important; line-height: 1.2 !important;">ဘောက်ချာနံပါတ် (Voucher No)</label>
          <input type="text" id="entry-voucher" placeholder="ဥပမာ- ၆၅၀-၁၂" style="width: 100% !important; height: 38px !important; padding: 0 12px !important; background-color: #020617 !important; border: 1px solid #334155 !important; border-radius: 10px !important; color: #f8fafc !important; font-size: 12px !important; box-sizing: border-box !important; outline: none !important;">
        </div>

        <div style="display: flex !important; flex-direction: column !important; gap: 6px !important;">
          <label style="font-size: 12px !important; font-weight: 700 !important; color: #f1f5f9 !important; margin: 0 !important; line-height: 1.2 !important;">ငွေပမာဏ (Amount - MMK) <span style="color: #f43f5e;">*</span></label>
          <input type="number" id="entry-amount" required placeholder="0.00" style="width: 100% !important; height: 38px !important; padding: 0 12px !important; background-color: #020617 !important; border: 1px solid #334155 !important; border-radius: 10px !important; color: #f8fafc !important; font-size: 12px !important; font-weight: 800 !important; box-sizing: border-box !important; outline: none !important;">
        </div>
      </div>

      <!-- Row 4: Receiver Dropdown -->
      <div style="display: flex !important; flex-direction: column !important; gap: 6px !important; width: 100% !important;">
        <label style="font-size: 12px !important; font-weight: 700 !important; color: #f1f5f9 !important; margin: 0 !important; line-height: 1.2 !important;">လက်ခံသူ / တာဝန်ခံ (User/Receiver)</label>
        <select id="entry-receiver" style="width: 100% !important; height: 38px !important; padding: 0 12px !important; background-color: #020617 !important; border: 1px solid #334155 !important; border-radius: 10px !important; color: #f8fafc !important; font-size: 12px !important; box-sizing: border-box !important; outline: none !important;">
          <option value="">-- တာဝန်ခံ ရွေးချယ်ပါ (Optional) --</option>
          <option value="User 1">User 1</option>
          <option value="User 2">User 2</option>
          <option value="User 3">User 3</option>
        </select>
      </div>

      <!-- Row 5: Description -->
      <div style="display: flex !important; flex-direction: column !important; gap: 6px !important; width: 100% !important;">
        <label style="font-size: 12px !important; font-weight: 700 !important; color: #f1f5f9 !important; margin: 0 !important; line-height: 1.2 !important;">အကြောင်းအရာ (Description)</label>
        <textarea id="entry-description" rows="2" placeholder="အသေးစိတ် အကြောင်းအရာ ရေးသားပါ..." style="width: 100% !important; padding: 10px 12px !important; background-color: #020617 !important; border: 1px solid #334155 !important; border-radius: 10px !important; color: #f8fafc !important; font-size: 12px !important; box-sizing: border-box !important; outline: none !important; resize: none !important;"></textarea>
      </div>

      <!-- Footer Buttons -->
      <div style="padding-top: 12px !important; border-top: 1px solid #1e293b !important; display: flex !important; align-items: center !important; justify-content: flex-end !important; gap: 12px !important;">
        <button type="button" onclick="closeEntryModal()" style="padding: 8px 18px !important; border-radius: 10px !important; background-color: #1e293b !important; color: #cbd5e1 !important; font-size: 12px !important; font-weight: 700 !important; border: none !important; cursor: pointer !important;">
          Cancel
        </button>
        <button type="submit" style="padding: 8px 22px !important; border-radius: 10px !important; background: linear-gradient(135deg, #d97706 0%, #b45309 100%) !important; color: #020617 !important; font-size: 12px !important; font-weight: 900 !important; border: none !important; cursor: pointer !important; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3) !important;">
          Save
        </button>
      </div>

    </form>
  </div>
</div>
