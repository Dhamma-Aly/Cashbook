<!-- view/Dashboard.html - Home Dashboard Fragment (Executive Sub-Tab Layout) -->
<div class="h-full flex flex-col space-y-5">

  <!-- Top 4 KPI Cards -->
  <div class="shrink-0 grid grid-cols-1 md:grid-cols-4 gap-4">
    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-amber-500/10 text-amber-400"><i class="fa-solid fa-vault text-xl"></i></div>
      <div>
        <p class="text-[10px] uppercase font-bold text-amber-400/80">စုစုပေါင်းရန်ပုံငွေ</p>
        <h3 id="kpi-home-fund" class="text-base font-extrabold text-amber-300 mt-1">0 MMK</h3>
      </div>
    </div>

    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-sky-500/10 text-sky-400"><i class="fa-solid fa-building-columns text-xl"></i></div>
      <div>
        <p class="text-[10px] uppercase font-bold text-amber-400/80">စုစုပေါင်းဘဏ်ရှိငွေ</p>
        <h3 id="kpi-home-bank" class="text-base font-extrabold text-sky-400 mt-1">0 MMK</h3>
      </div>
    </div>

    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-emerald-500/10 text-emerald-400"><i class="fa-solid fa-sack-dollar text-xl"></i></div>
      <div>
        <p class="text-[10px] uppercase font-bold text-amber-400/80">စုစုပေါင်းလက်ရှိငွေ</p>
        <h3 id="kpi-home-cash" class="text-base font-extrabold text-emerald-400 mt-1">0 MMK</h3>
      </div>
    </div>

    <div class="stats-card">
      <div class="p-3.5 rounded-lg bg-rose-500/10 text-rose-400"><i class="fa-solid fa-list-check text-xl"></i></div>
      <div>
        <p class="text-[10px] uppercase font-bold text-amber-400/80">စုစုပေါင်း စာကြောင်းရေ</p>
        <h3 id="kpi-home-count" class="text-base font-extrabold text-amber-100 mt-1">0</h3>
      </div>
    </div>
  </div>

  <!-- 💡 Sub-Tab Control Bar (ရန်ပုံငွေ အကျဉ်းချုပ် vs ယောဂီ ပေါင်းချုပ်) -->
  <div class="flex items-center justify-between bg-[#0f172a] border border-amber-500/20 p-2 sm:p-2.5 rounded-2xl shadow-xl shrink-0">
    <div class="flex items-center gap-2">
      <button id="tab-dash-fund" onclick="switchDashboardTab('fund')" class="px-4 py-2 rounded-xl text-xs font-black text-amber-300 bg-[#1e293b] border border-amber-500/30 transition-all flex items-center gap-2 cursor-pointer shadow-sm">
        <i class="fa-solid fa-building-columns text-amber-400"></i>
        <span>ရန်ပုံငွေ အကျဉ်းချုပ်</span>
      </button>
      <button id="tab-dash-yogi" onclick="switchDashboardTab('yogi')" class="px-4 py-2 rounded-xl text-xs font-bold text-amber-400/60 hover:text-amber-200 transition-all flex items-center gap-2 cursor-pointer">
        <i class="fa-solid fa-users text-amber-400/70"></i>
        <span>ယောဂီ ပေါင်းချုပ်</span>
      </button>
    </div>
    
    <span id="dash-tab-badge" class="hidden sm:inline-block text-[11px] font-bold text-amber-400/70 bg-amber-500/10 border border-amber-500/20 px-3 py-1 rounded-lg">
      (ပမာဏ - MMK)
    </span>
  </div>

  <!-- Section 1: Fund Summary Table (ရိပ်သာ ရန်ပုံငွေစာရင်း အကျဉ်းချုပ်) -->
  <div id="dash-fund-section" class="flex-1 flex flex-col bg-[#0f172a] border border-amber-500/20 rounded-2xl shadow-2xl overflow-hidden">
    <div class="px-6 py-3.5 border-b border-amber-500/20 bg-[#080d1a] shrink-0 flex items-center justify-between">
      <h3 class="text-sm md:text-base font-black text-amber-300 uppercase tracking-wider flex items-center gap-2.5">
        <i class="fa-solid fa-building-columns text-amber-400"></i> ရိပ်သာ ရန်ပုံငွေစာရင်း အကျဉ်းချုပ်
      </h3>
      <span class="text-[11px] font-bold text-amber-400/70 bg-amber-500/10 border border-amber-500/20 px-3 py-1 rounded-lg">(ပမာဏ - MMK)</span>
    </div>

    <div id="home-bank-table" class="overflow-x-auto flex-1">
      <div class="p-8 text-center text-amber-400/70 text-sm font-bold">
        <i class="fa-solid fa-spinner fa-spin mr-2"></i> ရန်ပုံငွေ ဒေတာများ ဆွဲယူနေပါသည်...
      </div>
    </div>
  </div>

  <!-- Section 2: Yogi Summary Table (ယောဂီပေါင်းချုပ်စာရင်း) -->
  <div id="dash-yogi-section" class="flex-1 flex flex-col bg-[#0f172a] border border-amber-500/20 rounded-2xl shadow-2xl overflow-hidden hidden">
    <div class="px-6 py-3.5 border-b border-amber-500/20 bg-[#080d1a] shrink-0 flex items-center justify-between">
      <h3 class="text-sm md:text-base font-black text-amber-300 uppercase tracking-wider flex items-center gap-2.5">
        <i class="fa-solid fa-users text-amber-400"></i> ယောဂီပေါင်းချုပ်စာရင်း
      </h3>
      <span class="text-[11px] font-bold text-amber-400/70 bg-amber-500/10 border border-amber-500/20 px-3 py-1 rounded-lg">စခန်းတွင်း Active ယောဂီများ</span>
    </div>

    <div id="home-yogi-table" class="overflow-x-auto flex-1">
      <div class="p-8 text-center text-amber-400/70 text-sm font-bold">
        <i class="fa-solid fa-spinner fa-spin mr-2"></i> ယောဂီ ဒေတာများ ဆွဲယူနေပါသည်...
      </div>
    </div>
  </div>

</div>
