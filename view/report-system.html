<!-- view/report-system.html - Annual & Summary Expense Matrix Report -->

<div id="report-section" class="space-y-5">
  
  <!-- 💡 ELEGANT & SPACIOUS ACTION BAR -->
  <div class="flex flex-col lg:flex-row justify-between items-center bg-[#0f172a] border border-amber-500/20 p-4 rounded-xl gap-4 shadow-xl w-full">
    
    <!-- Left: Search Box (Glassmorphic) -->
    <div class="relative w-full lg:w-80 shrink-0">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
      <input type="text" id="report-search-input" oninput="onReportSearchInput()" placeholder="ရှာဖွေရန်..." class="w-full pl-9 pr-4 py-2 text-xs rounded-xl bg-[#080d1a]/80 backdrop-blur-md border border-amber-500/30 text-slate-100 placeholder:text-slate-400 outline-none focus:border-amber-400 font-medium">
    </div>

    <!-- Right: All Controls Spacious & Neat -->
    <div class="flex flex-wrap items-center justify-end gap-3 w-full lg:w-auto shrink-0 whitespace-nowrap">
      
      <!-- Annual vs Summary Mode Toggle -->
      <div class="flex items-center gap-1.5 bg-[#080d1a] border border-amber-500/30 p-1 rounded-xl text-xs">
        <button id="btn-report-annual" onclick="switchReportMode('Annual')" class="px-4 py-2 rounded-lg font-extrabold text-amber-300 bg-[#1e293b] border border-amber-500/30 transition-all flex items-center gap-2 cursor-pointer shadow-sm">
          <i class="fa-solid fa-calendar-days text-xs text-amber-400"></i>
          <span>Annual</span>
        </button>
        <button id="btn-report-summary" onclick="switchReportMode('Summary')" class="px-4 py-2 rounded-lg font-bold text-amber-400/60 hover:text-amber-200 transition-all flex items-center gap-2 cursor-pointer">
          <i class="fa-solid fa-chart-column text-xs text-amber-400/70"></i>
          <span>Summary</span>
        </button>
      </div>

      <!-- Year Selector Dropdown -->
      <div class="flex items-center gap-2 bg-[#080d1a] border border-amber-500/30 px-3.5 py-2 rounded-xl text-xs font-extrabold text-amber-200 shadow-sm">
        <i class="fa-solid fa-calendar text-amber-400 text-xs"></i>
        <label for="report-year-select" class="text-amber-400/90 font-bold">ခုနှစ်:</label>
        <select id="report-year-select" onchange="onReportYearChange(this.value)" class="bg-transparent text-amber-300 font-black outline-none cursor-pointer text-xs pr-1">
          <option value="2026" selected>2026</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
        </select>
      </div>

      <!-- Refresh & Export Buttons -->
      <button onclick="renderReportView()" class="px-4 py-2 bg-[#1e293b] hover:bg-[#334155] border border-amber-500/30 text-amber-200 rounded-xl text-xs font-extrabold transition-all flex items-center gap-2 cursor-pointer shadow-sm" title="Refresh">
        <i class="fa-solid fa-rotate text-xs text-amber-400"></i>
        <span>Refresh</span>
      </button>
      
      <button onclick="exportReportCSV()" class="px-4 py-2 bg-[#1e293b] hover:bg-[#334155] border border-amber-500/30 text-amber-200 rounded-xl text-xs font-extrabold transition-all flex items-center gap-2 cursor-pointer shadow-sm" title="Export CSV">
        <i class="fa-solid fa-file-export text-xs text-amber-400"></i>
        <span>Export</span>
      </button>

    </div>

  </div>

  <!-- 📊 16-Column Annual & Summary Matrix Table Container -->
  <div class="bg-[#0f172a] border border-amber-500/20 rounded-2xl overflow-x-auto shadow-2xl relative">
    <table id="report-matrix-table" class="table-lg w-full text-left border-collapse min-w-[1600px] text-xs">
      <thead id="report-table-header">
        <tr class="bg-[#080d1a] border-b border-amber-500/30 text-amber-300 uppercase font-extrabold">
          <th class="w-20 py-3.5 px-3">Head</th>
          <th class="min-w-[160px] py-3.5 px-3">Category</th>
          <th class="min-w-[180px] py-3.5 px-3">Sub Category</th>
          <th class="text-right w-24 py-3.5 px-2">Jan-26</th>
          <th class="text-right w-24 py-3.5 px-2">Feb-26</th>
          <th class="text-right w-24 py-3.5 px-2">Mar-26</th>
          <th class="text-right w-24 py-3.5 px-2">Apr-26</th>
          <th class="text-right w-24 py-3.5 px-2">May-26</th>
          <th class="text-right w-24 py-3.5 px-2">Jun-26</th>
          <th class="text-right w-24 py-3.5 px-2">Jul-26</th>
          <th class="text-right w-24 py-3.5 px-2">Aug-26</th>
          <th class="text-right w-24 py-3.5 px-2">Sep-26</th>
          <th class="text-right w-24 py-3.5 px-2">Oct-26</th>
          <th class="text-right w-24 py-3.5 px-2">Nov-26</th>
          <th class="text-right w-24 py-3.5 px-2">Dec-26</th>
          <th class="text-right w-28 py-3.5 px-3 bg-amber-500/10 text-amber-300 font-black">Total</th>
        </tr>
      </thead>
      <tbody id="report-table-body" class="divide-y divide-amber-500/10">
        <tr>
          <td colspan="16" class="text-center py-16 text-amber-400 font-bold">
            <i class="fa-solid fa-dharmachakra fa-spin text-xl mr-3 text-amber-400/60"></i>
            အစီရင်ခံစာ ဒေတာများ ဆွဲယူနေပါသည်...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
