<!-- view/report-system.html - Annual & Summary Expense Matrix Report (Ultra-Compact Single Row) -->

<div id="report-section" class="space-y-4">
  
  <!-- 💡 ULTRA-COMPACT SINGLE-ROW ACTION BAR (Height ~48px) -->
  <div class="flex flex-row items-center justify-between bg-[#0f172a] border border-amber-500/20 px-4 py-2.5 rounded-xl gap-3 shadow-xl w-full overflow-x-auto">
    
    <!-- Left: Search Box (Compact 250px Width) -->
    <div class="relative w-48 sm:w-64 shrink-0">
      <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
      <input type="text" id="report-search-input" oninput="onReportSearchInput()" placeholder="ရှာဖွေရန်..." class="w-full pl-8 pr-3 py-1.5 text-xs rounded-lg bg-[#080d1a] border border-amber-500/30 text-slate-100 placeholder:text-slate-400 outline-none focus:border-amber-400 transition-all font-medium">
    </div>

    <!-- Right: All Controls on the Same Single Line -->
    <div class="flex items-center gap-2 sm:gap-3 shrink-0 whitespace-nowrap">
      
      <!-- Annual vs Summary Mode Toggle -->
      <div class="flex items-center gap-0.5 bg-[#080d1a] border border-amber-500/20 p-0.5 rounded-lg text-xs">
        <button id="btn-report-annual" onclick="switchReportMode('Annual')" class="px-2.5 py-1 rounded-md font-bold text-amber-300 bg-[#1e293b] border border-amber-500/30 transition-all flex items-center gap-1 cursor-pointer">
          <i class="fa-solid fa-calendar-days text-[11px]"></i> Annual
        </button>
        <button id="btn-report-summary" onclick="switchReportMode('Summary')" class="px-2.5 py-1 rounded-md font-bold text-amber-400/60 hover:text-amber-200 transition-all flex items-center gap-1 cursor-pointer">
          <i class="fa-solid fa-chart-column text-[11px]"></i> Summary
        </button>
      </div>

      <!-- Year Selector Dropdown -->
      <div class="flex items-center gap-1 bg-[#080d1a] border border-amber-500/30 px-2.5 py-1 rounded-lg text-xs font-bold text-amber-200">
        <label for="report-year-select" class="text-amber-400/80 text-[11px]">ခုနှစ်:</label>
        <select id="report-year-select" onchange="onReportYearChange(this.value)" class="bg-transparent text-amber-300 font-extrabold outline-none cursor-pointer text-xs">
          <option value="2026" selected>2026</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
        </select>
      </div>

      <!-- Refresh & Export Buttons -->
      <button onclick="renderReportView()" class="px-3 py-1.5 bg-[#1e293b] hover:bg-[#334155] border border-amber-500/30 text-amber-200 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer" title="Refresh">
        <i class="fa-solid fa-rotate text-xs"></i> Refresh
      </button>
      
      <button onclick="exportReportCSV()" class="px-3 py-1.5 bg-[#1e293b] hover:bg-[#334155] border border-amber-500/30 text-amber-200 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer" title="Export CSV">
        <i class="fa-solid fa-file-export text-xs"></i> Export
      </button>

    </div>

  </div>

  <!-- 📊 16-Column Annual & Summary Matrix Table Container -->
  <div class="bg-[#0f172a] border border-amber-500/20 rounded-2xl overflow-x-auto shadow-2xl relative">
    <table id="report-matrix-table" class="table-lg w-full text-left border-collapse min-w-[1600px] text-xs">
      <thead id="report-table-header">
        <tr class="bg-[#080d1a] border-b border-amber-500/30 text-amber-300 uppercase font-extrabold">
          <th class="w-20 py-3.5 px-3">Head</th>
          <th class="min-w-[160px] py-3.5 px-3">Category</th>
          <th class="min-w-[180px] py-3.5 px-3">Sub Category</th>
          <th class="text-right w-24 py-3.5 px-2">Jan-26</th>
          <th class="text-right w-24 py-3.5 px-2">Feb-26</th>
          <th class="text-right w-24 py-3.5 px-2">Mar-26</th>
          <th class="text-right w-24 py-3.5 px-2">Apr-26</th>
          <th class="text-right w-24 py-3.5 px-2">May-26</th>
          <th class="text-right w-24 py-3.5 px-2">Jun-26</th>
          <th class="text-right w-24 py-3.5 px-2">Jul-26</th>
          <th class="text-right w-24 py-3.5 px-2">Aug-26</th>
          <th class="text-right w-24 py-3.5 px-2">Sep-26</th>
          <th class="text-right w-24 py-3.5 px-2">Oct-26</th>
          <th class="text-right w-24 py-3.5 px-2">Nov-26</th>
          <th class="text-right w-24 py-3.5 px-2">Dec-26</th>
          <th class="text-right w-28 py-3.5 px-3 bg-amber-500/10 text-amber-300 font-black">Total</th>
        </tr>
      </thead>
      <tbody id="report-table-body" class="divide-y divide-amber-500/10">
        <tr>
          <td colspan="16" class="text-center py-16 text-amber-400 font-bold">
            <i class="fa-solid fa-dharmachakra fa-spin text-xl mr-3 text-amber-400/60"></i>
            အစီရင်ခံစာ ဒေတာများ ဆွဲယူနေပါသည်...
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
