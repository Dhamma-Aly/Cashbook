<!-- Yogi Entry Modal (Ultra-Neat & Responsive Form) -->
<div id="yogi-entry-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[100] flex items-center justify-center p-3 sm:p-4 hidden">
  <div class="bg-[#0e172a] border border-amber-500/40 rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
    
    <!-- Modal Header -->
    <div class="px-5 py-3.5 bg-[#080d1a] border-b border-amber-500/30 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-amber-500/15 border border-amber-500/30 text-amber-400 flex items-center justify-center text-sm">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h3 id="yogi-modal-title" class="text-sm sm:text-base font-black text-amber-300 tracking-wide">
          ယောဂီ အချက်အလက် သွင်းယူ / ပြင်ဆင်ရန်
        </h3>
      </div>
      <button type="button" onclick="closeYogiModal()" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-400 hover:text-rose-400 hover:bg-slate-700 transition flex items-center justify-center">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>

    <!-- Modal Form Body (Scrollable & 2-Column Grid) -->
    <form id="yogi-entry-form" onsubmit="saveYogiEntryForm(event)" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 text-xs">
      
      <!-- Hidden Inputs -->
      <input type="hidden" id="yogi-uniqueId" value="">
      <input type="hidden" id="yogi-sheet-type" value="12Yogi">

      <!-- Row 1: အမျိုးအစား & စတင်ရက်စွဲ -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block font-extrabold text-amber-200/90 mb-1">အမျိုးအစား (Category)</label>
          <select id="yogi-category" class="w-full h-10 px-3 bg-[#080d1a] border border-amber-500/30 rounded-xl text-slate-200 outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 font-bold">
            <option value="လူပုဂ္ဂိုလ်">လူပုဂ္ဂိုလ်</option>
            <option value="ရဟန်း/သံဃာ">ရဟန်း / သံဃာတော်</option>
            <option value="သီလရှင်">သီလရှင်</option>
          </select>
        </div>

        <div>
          <label class="block font-extrabold text-amber-200/90 mb-1">စတင်ရက်စွဲ (Start Date)</label>
          <input type="date" id="yogi-start-date" required class="w-full h-10 px-3 bg-[#080d1a] border border-amber-500/30 rounded-xl text-slate-200 outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400">
        </div>
      </div>

      <!-- Row 2: ယောဂီအမည် & အဘအမည် -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block font-extrabold text-amber-200/90 mb-1">ယောဂီ အမည် <span class="text-rose-400">*</span></label>
          <input type="text" id="yogi-name" required placeholder="ဥပမာ- ဦးလှမောင်" oninput="onYogiNameChange(this.value)" class="w-full h-10 px-3 bg-[#080d1a] border border-amber-500/30 rounded-xl text-slate-200 placeholder:text-slate-600 outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 font-bold">
        </div>

        <div>
          <label class="block font-extrabold text-amber-200/90 mb-1">အဘ အမည်</label>
          <input type="text" id="yogi-father-name" placeholder="ဥပမာ- ဦးဘမောင်" class="w-full h-10 px-3 bg-[#080d1a] border border-amber-500/30 rounded-xl text-slate-200 placeholder:text-slate-600 outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400">
        </div>
      </div>

      <!-- Row 3: မှတ်ပုံတင်အမှတ် (NRC - Compact 4 Parts) -->
      <div>
        <label class="block font-extrabold text-amber-200/90 mb-1">မှတ်ပုံတင်အမှတ် (NRC)</label>
        <div class="grid grid-cols-12 gap-2">
          <select id="yogi-nrc-state" class="col-span-3 h-10 px-2 bg-[#080d1a] border border-amber-500/30 rounded-xl text-slate-200 outline-none focus:border-amber-400">
            <option value="12">12/</option>
            <option value="1">1/</option><option value="2">2/</option><option value="3">3/</option>
            <option value="4">4/</option><option value="5">5/</option><option value="6">6/</option>
            <option value="7">7/</option><option value="8">8/</option><option value="9">9/</option>
            <option value="10">10/</option><option value="11">11/</option><option value="13">13/</option>
            <option value="14">14/</option>
          </select>
          <input type="text" id="yogi-nrc-township" placeholder="ရကန" class="col-span-3 h-10 px-2 bg-[#080d1a] border border-amber-500/30 rounded-xl text-slate-200 placeholder:text-slate-600 outline-none focus:border-amber-400 text-center font-bold">
          <select id="yogi-nrc-type" class="col-span-3 h-10 px-1 bg-[#080d1a] border border-amber-500/30 rounded-xl text-slate-200 outline-none focus:border-amber-400 text-center">
            <option value="(နိုင်)">(နိုင်)</option>
            <option value="(ဧည့်)">(ဧည့်)</option>
            <option value="(ပြု)">(ပြု)</option>
            <option value="(သာ)">(သာ)</option>
          </select>
          <input type="text" id="yogi-nrc-number" maxlength="6" placeholder="123456" class="col-span-3 h-10 px-2 bg-[#080d1a] border border-amber-500/30 rounded-xl text-slate-200 placeholder:text-slate-600 outline-none focus:border-amber-400 font-mono font-bold text-center">
        </div>
      </div>

      <!-- Row 4: မွေးသက္ကရာဇ် & အသက် & ကျား/မ -->
      <div class="grid grid-cols-12 gap-3">
        <div class="col-span-12 sm:col-span-5">
          <label class="block font-extrabold text-amber-200/90 mb-1">မွေးသက္ကရာဇ် (DOB)</label>
          <input type="date" id="yogi-dob" onchange="onYogiDoBChange(this.value)" class="w-full h-10 px-3 bg-[#080d1a] border border-amber-500/30 rounded-xl text-slate-200 outline-none focus:border-amber-400">
        </div>

        <div class="col-span-6 sm:col-span-3">
          <label class="block font-extrabold text-amber-200/90 mb-1">အသက် (Age)</label>
          <input type="number" id="yogi-age" placeholder="45" class="w-full h-10 px-3 bg-[#080d1a] border border-amber-500/30 rounded-xl text-slate-200 placeholder:text-slate-600 outline-none focus:border-amber-400 font-mono font-bold">
        </div>

        <div class="col-span-6 sm:col-span-4">
          <label class="block font-extrabold text-amber-200/90 mb-1">ကျား / မ (Gender)</label>
          <select id="yogi-gender" class="w-full h-10 px-3 bg-[#080d1a] border border-amber-500/30 rounded-xl text-slate-200 outline-none focus:border-amber-400 font-bold">
            <option value="ကျား">ကျား</option>
            <option value="မ">မ</option>
          </select>
        </div>
      </div>

      <!-- Row 5: ယောဂီဖုန်း & အိမ်ဖုန်း -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block font-extrabold text-amber-200/90 mb-1">ယောဂီ ဖုန်းနံပါတ်</label>
          <input type="text" id="yogi-phone" placeholder="09-123456789" class="w-full h-10 px-3 bg-[#080d1a] border border-amber-500/30 rounded-xl text-slate-200 placeholder:text-slate-600 outline-none focus:border-amber-400 font-mono font-bold">
        </div>

        <div>
          <label class="block font-extrabold text-amber-200/90 mb-1">အိမ်ဖုန်းနံပါတ်</label>
          <input type="text" id="yogi-home-phone" placeholder="09-987654321" class="w-full h-10 px-3 bg-[#080d1a] border border-amber-500/30 rounded-xl text-slate-200 placeholder:text-slate-600 outline-none focus:border-amber-400 font-mono">
        </div>
      </div>

      <!-- Row 6: နေရပ်လိပ်စာ -->
      <div>
        <label class="block font-extrabold text-amber-200/90 mb-1">နေရပ်လိပ်စာ</label>
        <textarea id="yogi-address" rows="2" placeholder="မြို့နယ်၊ တိုင်းဒေသကြီး / ပြည်နယ်..." class="w-full p-3 bg-[#080d1a] border border-amber-500/30 rounded-xl text-slate-200 placeholder:text-slate-600 outline-none focus:border-amber-400 resize-none"></textarea>
      </div>

      <!-- Modal Footer Action Buttons (Sticky & Always Visible at Bottom) -->
      <div class="pt-4 border-t border-slate-800 flex items-center justify-end gap-3 shrink-0">
        <button type="button" onclick="closeYogiModal()" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-extrabold text-xs transition">
          မသိမ်းတော့ပါ (Cancel)
        </button>

        <button type="submit" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 via-amber-600 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-slate-950 font-black text-xs transition shadow-lg shadow-amber-500/20 flex items-center gap-2">
          <i class="fa-solid fa-floppy-disk"></i>
          <span>သိမ်းဆည်းမည် (Save)</span>
        </button>
      </div>

    </form>
  </div>
</div>
